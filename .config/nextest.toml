# nextest configuration for rcp
# https://nexte.st/book/configuration.html

[profile.default]
# allow most tests to run in parallel
test-threads = 32

[test-groups]
# serial execution for localhost-SSH integration and remote-library tests
serial = { max-threads = 1 }

# localhost-SSH integration and remote-library tests must run serially to avoid connection conflicts
[[profile.default.overrides]]
filter = 'binary(=remote_tests) | (package(=rcp-tools-remote) & test(/^tests::test_remote_/))'
test-group = 'serial'

# docker tests must run serially to avoid port/connection conflicts.
# binary(~docker) uses regex matching: ~ means "contains", so this matches any
# test binary with "docker" in its name (e.g., docker_multi_host, docker_chaos_network).
[[profile.default.overrides]]
filter = 'binary(~docker)'
test-group = 'serial'

# saturation regressions use tight admission-timeout budgets. Serialize the renamed modules so
# CPU contention on small CI runners cannot consume most of those budgets before a task is polled.
[[profile.default.overrides]]
filter = 'test(max_files_in_flight)'
test-group = 'serial'

[profile.docker]
# docker profile runs Docker integration tests (multi-host and chaos tests)
# these tests are normally ignored and require Docker containers
default-filter = 'binary(~docker)'
