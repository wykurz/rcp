x-rcp-binary-mounts: &rcp-binary-mounts
  - "../../target/${RCP_DOCKER_TARGET:?set RCP_DOCKER_TARGET}/debug/rcp:/home/testuser/.local/bin/rcp:ro"
  - "../../target/${RCP_DOCKER_TARGET:?set RCP_DOCKER_TARGET}/debug/rcpd:/home/testuser/.local/bin/rcpd:ro"
  - "../../target/${RCP_DOCKER_TARGET:?set RCP_DOCKER_TARGET}/debug/rrm:/home/testuser/.local/bin/rrm:ro"
  - "../../target/${RCP_DOCKER_TARGET:?set RCP_DOCKER_TARGET}/debug/rlink:/home/testuser/.local/bin/rlink:ro"
  - "../../target/${RCP_DOCKER_TARGET:?set RCP_DOCKER_TARGET}/debug/rcmp:/home/testuser/.local/bin/rcmp:ro"

services:
  # Master node - where we run rcp commands from
  master:
    build:
      context: .
      dockerfile: Dockerfile.ssh-host
    container_name: rcp-test-master
    hostname: master
    # privileged mode required for mount commands in I/O chaos tests
    # (capabilities + seccomp:unconfined are insufficient on GitHub Actions runners)
    privileged: true
    networks:
      - rcp-test-net
    # mount musl binaries built for the selected container architecture
    volumes: *rcp-binary-mounts
    ports:
      # Expose SSH for debugging (ssh -p 2220 testuser@localhost)
      - "2220:22"
    # Explicitly run SSH daemon (tty/stdin_open would otherwise override Dockerfile CMD)
    command: /usr/sbin/sshd -D -e

  # Host A - first remote host
  host-a:
    build:
      context: .
      dockerfile: Dockerfile.ssh-host
    container_name: rcp-test-host-a
    hostname: host-a
    # privileged mode required for mount commands in I/O chaos tests
    # (capabilities + seccomp:unconfined are insufficient on GitHub Actions runners)
    privileged: true
    networks:
      - rcp-test-net
    volumes: *rcp-binary-mounts
    ports:
      # Expose SSH for debugging (ssh -p 2221 testuser@localhost)
      - "2221:22"
    command: /usr/sbin/sshd -D -e

  # Host B - second remote host
  host-b:
    build:
      context: .
      dockerfile: Dockerfile.ssh-host
    container_name: rcp-test-host-b
    hostname: host-b
    # privileged mode required for mount commands in I/O chaos tests
    # (capabilities + seccomp:unconfined are insufficient on GitHub Actions runners)
    privileged: true
    networks:
      - rcp-test-net
    volumes: *rcp-binary-mounts
    ports:
      # Expose SSH for debugging (ssh -p 2222 testuser@localhost)
      - "2222:22"
    command: /usr/sbin/sshd -D -e

networks:
  rcp-test-net:
    driver: bridge
    name: rcp-test-network
