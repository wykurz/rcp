<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 718" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Rejected directories settle one parent entry</title>
  <desc id="desc">A parent has admitted bad and good subdirectories. A child Begin already submitted under bad receives its own rejection. Every begun directory receives End even when rejected. No data file is sent under rejected directories.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/></marker></defs>
  <rect x="1" y="1" width="998" height="716" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="32" y="34" font-size="18" font-weight="600" fill="#0f172a">Rejected directories settle one parent entry</text>
<rect x="175" y="56" width="170" height="36" rx="6" fill="#e2e8f0"/><text x="260" y="80" text-anchor="middle" font-size="14" fill="#0f172a">Source (rcpd)</text><line x1="260" y1="92" x2="260" y2="630" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="615" y="56" width="170" height="36" rx="6" fill="#e2e8f0"/><text x="700" y="80" text-anchor="middle" font-size="14" fill="#0f172a">Destination (rcpd)</text><line x1="700" y1="92" x2="700" y2="630" stroke="#94a3b8" stroke-dasharray="5 5"/>
<line x1="260" y1="130" x2="694" y2="130" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="121" text-anchor="middle" font-size="12.5" font-family="ui-monospace, monospace" fill="#334155">DirectoryBegin(bad, metadata)</text>
<text x="714" y="127" text-anchor="start" font-size="12" fill="#475569">creation fails</text>
<text x="714" y="144" text-anchor="start" font-size="12" fill="#475569">record rejected Begin</text>
<line x1="260" y1="186" x2="694" y2="186" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="177" text-anchor="middle" font-size="12.5" font-family="ui-monospace, monospace" fill="#334155">DirectoryBegin(bad/child, metadata)</text>
<text x="246" y="183" text-anchor="end" font-size="12" fill="#475569">already submitted work</text>
<text x="714" y="183" text-anchor="start" font-size="12" fill="#475569">failed ancestor: reject child</text>
<line x1="700" y1="242" x2="266" y2="242" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="233" text-anchor="middle" font-size="12.5" font-family="ui-monospace, monospace" fill="#334155">DirectorySkipped(bad)</text>
<text x="246" y="239" text-anchor="end" font-size="12" fill="#475569">stop new subtree work</text>
<text x="246" y="256" text-anchor="end" font-size="12" fill="#475569">drain started classifiers</text>
<text x="714" y="239" text-anchor="start" font-size="12" fill="#475569">complete bad in its parent once</text>
<line x1="700" y1="306" x2="266" y2="306" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="297" text-anchor="middle" font-size="12.5" font-family="ui-monospace, monospace" fill="#334155">DirectorySkipped(bad/child)</text>
<text x="246" y="303" text-anchor="end" font-size="12" fill="#475569">return child Begin credit</text>
<text x="714" y="303" text-anchor="start" font-size="12" fill="#475569">no second ancestor completion</text>
<line x1="260" y1="370" x2="694" y2="370" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="361" text-anchor="middle" font-size="12.5" font-family="ui-monospace, monospace" fill="#334155">DirectoryEnd(bad/child, count=0)</text>
<text x="714" y="367" text-anchor="start" font-size="12" fill="#475569">close rejected discovery record</text>
<line x1="260" y1="426" x2="694" y2="426" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="417" text-anchor="middle" font-size="12.5" font-family="ui-monospace, monospace" fill="#334155">DirectoryEnd(bad, count=1)</text>
<text x="714" y="423" text-anchor="start" font-size="12" fill="#475569">close rejected discovery record</text>
<rect x="285" y="460" width="390" height="32" rx="5" fill="#eff6ff"/><text x="480" y="481" text-anchor="middle" font-size="12.5" fill="#1e40af">Sibling directory good continues copying</text>
<text x="246" y="479" text-anchor="end" font-size="12" fill="#475569">no data sends under bad</text>
<text x="714" y="479" text-anchor="start" font-size="12" fill="#475569">keep accepting control traffic</text>
<line x1="260" y1="538" x2="694" y2="538" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="529" text-anchor="middle" font-size="12.5" font-family="ui-monospace, monospace" fill="#334155">DiscoveryComplete(true)</text>
<text x="246" y="535" text-anchor="end" font-size="12" fill="#475569">every Begin has an End</text>
<text x="714" y="535" text-anchor="start" font-size="12" fill="#475569">wait for other admitted work</text>
<line x1="700" y1="596" x2="266" y2="596" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="587" text-anchor="middle" font-size="12.5" font-family="ui-monospace, monospace" fill="#334155">DestinationDone</text>
<text x="246" y="593" text-anchor="end" font-size="12" fill="#475569">report collected source errors</text>
<text x="714" y="593" text-anchor="start" font-size="12" fill="#475569">report collected destination errors</text>
<rect x="24" y="650" width="952" height="44" rx="6" fill="#f1f5f9"/><text x="500" y="676" text-anchor="middle" font-size="12.5" fill="#334155">A fatal failure cancels the session and wakes admission waiters; it never waits for missing acknowledgements.</text></svg>
