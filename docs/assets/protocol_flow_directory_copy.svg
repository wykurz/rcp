<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 866" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Discovery overlaps file transfer</title>
  <desc id="desc">One valid interleaving for root containing file a and child directory containing file b. Files a and b use independent data streams while directory discovery continues. DirectoryEnd seals each direct-child count; metadata is applied after all children finish.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"/></marker></defs>
  <rect x="1" y="1" width="998" height="864" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="32" y="34" font-size="18" font-weight="600" fill="#0f172a">Discovery overlaps file transfer</text>
<rect x="175" y="56" width="170" height="36" rx="6" fill="#e2e8f0"/><text x="260" y="80" text-anchor="middle" font-size="14" fill="#0f172a">Source (rcpd)</text><line x1="260" y1="92" x2="260" y2="778" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="615" y="56" width="170" height="36" rx="6" fill="#e2e8f0"/><text x="700" y="80" text-anchor="middle" font-size="14" fill="#0f172a">Destination (rcpd)</text><line x1="700" y1="92" x2="700" y2="778" stroke="#94a3b8" stroke-dasharray="5 5"/>
<line x1="260" y1="130" x2="694" y2="130" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="121" text-anchor="middle" font-size="12.5" font-family="ui-monospace, monospace" fill="#334155">DirectoryBegin(root, metadata)</text>
<text x="246" y="127" text-anchor="end" font-size="12" fill="#475569">open held root</text>
<text x="714" y="127" text-anchor="start" font-size="12" fill="#475569">create or reuse root</text>
<text x="714" y="144" text-anchor="start" font-size="12" fill="#475569">retain metadata and directory fd</text>
<line x1="700" y1="184" x2="266" y2="184" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="175" text-anchor="middle" font-size="12.5" font-family="ui-monospace, monospace" fill="#334155">DirectoryManifestChunk(root, …)</text>
<text x="714" y="181" text-anchor="start" font-size="12" fill="#475569">reused directory only</text>
<line x1="700" y1="230" x2="266" y2="230" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="221" text-anchor="middle" font-size="12.5" font-family="ui-monospace, monospace" fill="#334155">DirectoryReady(root)</text>
<text x="246" y="227" text-anchor="end" font-size="12" fill="#475569">scan one cursor</text>
<line x1="260" y1="280" x2="694" y2="280" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="271" text-anchor="middle" font-size="12.5" font-family="ui-monospace, monospace" fill="#334155">DirectoryBegin(child, metadata)</text>
<text x="246" y="277" text-anchor="end" font-size="12" fill="#475569">scan child concurrently</text>
<text x="714" y="277" text-anchor="start" font-size="12" fill="#475569">retain child metadata</text>
<line x1="700" y1="326" x2="266" y2="326" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="317" text-anchor="middle" font-size="12.5" font-family="ui-monospace, monospace" fill="#334155">DirectoryReady(child)</text>
<line x1="260" y1="372" x2="694" y2="372" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="363" text-anchor="middle" font-size="12.5" font-family="ui-monospace, monospace" fill="#2563eb">File(a) + bytes [stream 1]</text>
<text x="246" y="369" text-anchor="end" font-size="12" fill="#475569">dispatch as discovered</text>
<text x="714" y="369" text-anchor="start" font-size="12" fill="#475569">file a in flight</text>
<line x1="260" y1="418" x2="694" y2="418" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="409" text-anchor="middle" font-size="12.5" font-family="ui-monospace, monospace" fill="#2563eb">File(b) + bytes [stream 2]</text>
<text x="246" y="415" text-anchor="end" font-size="12" fill="#475569">enumeration continues</text>
<text x="714" y="415" text-anchor="start" font-size="12" fill="#475569">file b in flight</text>
<line x1="260" y1="474" x2="694" y2="474" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="465" text-anchor="middle" font-size="12.5" font-family="ui-monospace, monospace" fill="#334155">DirectoryEnd(child, count=1)</text>
<text x="246" y="471" text-anchor="end" font-size="12" fill="#475569">child cursor at EOF</text>
<text x="714" y="471" text-anchor="start" font-size="12" fill="#475569">sealed; file b still pending</text>
<line x1="260" y1="528" x2="694" y2="528" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="519" text-anchor="middle" font-size="12.5" font-family="ui-monospace, monospace" fill="#334155">DirectoryEnd(root, count=2)</text>
<text x="246" y="525" text-anchor="end" font-size="12" fill="#475569">root cursor at EOF</text>
<text x="714" y="525" text-anchor="start" font-size="12" fill="#475569">sealed; a and child pending</text>
<line x1="260" y1="580" x2="694" y2="580" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="571" text-anchor="middle" font-size="12.5" font-family="ui-monospace, monospace" fill="#334155">DiscoveryComplete(true)</text>
<text x="246" y="577" text-anchor="end" font-size="12" fill="#475569">all discovery workers joined</text>
<text x="714" y="577" text-anchor="start" font-size="12" fill="#475569">file work may still be pending</text>
<rect x="285" y="612" width="390" height="32" rx="5" fill="#eff6ff"/><text x="480" y="633" text-anchor="middle" font-size="12.5" fill="#1e40af">File b finishes</text>
<text x="714" y="631" text-anchor="start" font-size="12" fill="#475569">finalize child metadata</text>
<text x="714" y="648" text-anchor="start" font-size="12" fill="#475569">complete one root child</text>
<rect x="285" y="666" width="390" height="32" rx="5" fill="#eff6ff"/><text x="480" y="687" text-anchor="middle" font-size="12.5" fill="#1e40af">File a finishes</text>
<text x="714" y="685" text-anchor="start" font-size="12" fill="#475569">root has 2/2 completed children</text>
<text x="714" y="702" text-anchor="start" font-size="12" fill="#475569">finalize root metadata</text>
<line x1="700" y1="744" x2="266" y2="744" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/><text x="480" y="735" text-anchor="middle" font-size="12.5" font-family="ui-monospace, monospace" fill="#334155">DestinationDone</text>
<text x="246" y="741" text-anchor="end" font-size="12" fill="#475569">drain file task results</text>
<text x="714" y="741" text-anchor="start" font-size="12" fill="#475569">discovery and root complete</text>
<rect x="24" y="798" width="952" height="44" rx="6" fill="#f1f5f9"/><text x="500" y="824" text-anchor="middle" font-size="12.5" fill="#334155">Control messages are ordered. Data streams overlap; DirectoryEnd does not mean file data has finished.</text></svg>
