<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title · RCP Tools</title>
  $theme
  <link rel="stylesheet" href="$stylesheet">
</head>
<body>
  <a class="skip-link" href="#report-content">Skip to report</a>
  <header class="site-header">
    <a class="brand" href="$reports"><img src="$logo" alt="" width="40" height="40"><span>RCP Tools</span></a>
    <nav aria-label="Site navigation">
      <a href="$reports">Reports</a>
      <a href="$history">Benchmark history</a>
      <a href="$repository">GitHub</a>
      <button type="button" class="theme-toggle" data-theme-toggle hidden>Light theme</button>
    </nav>
  </header>
  <div class="page-layout">
    <aside class="contents">
      <details open>
        <summary>On this page</summary>
        <nav aria-label="Table of contents"><ul>$toc</ul></nav>
      </details>
      <a class="source-link" href="$source">Markdown source ↗</a>
    </aside>
    <main id="report-content">
      <article>$body</article>
      <footer>RCP Tools · <a href="$source">Report source</a> · <a href="$reports">All reports</a></footer>
    </main>
  </div>
</body>
</html>
