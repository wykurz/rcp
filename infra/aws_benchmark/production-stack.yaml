# disabled engineering only; deployment and activation require separate approval
# external pinned launch template must reference the new profile; operators seed policy and ledger
# trusted admission code enforces positive reservations and conditional fences; IAM bounds attributes, not ADD sign
# ConditionCheckItem has no standalone API and does not document EnclosingOperation support
# write actions retain EnclosingOperation; the approved no-worker canary must verify their transaction fence
# worker outputs require create-only writes; code bounds bytes and lifecycle bounds retention
# collector only retains evidence and retires ownership; it has no launch authority
# preactivation requires an approved tiny no-worker conditional-copy + IAM canary: the current
# CopyObject API and an older user-guide page conflict. offline tests do not prove capability.
# fail closed if unsupported; never weaken create-only writes to enable production
AWSTemplateFormatVersion: '2010-09-09'
Description: Initially disabled production benchmark admission and direct EC2 runtime; separate review and activation required.
Parameters:
  ResourcePrefix: {Type: String, Default: rcp-production-benchmark, AllowedPattern: 'rcp-production-[a-z0-9-]{1,24}'}
  RuntimeEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Enable only after reviewed deployment, funding, image and cutoff validation.
  AdmissionEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Permit new submissions; disabling admission leaves an activated watchdog running.
  PublicationEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Separately approve read-only production evidence access from the existing main GitHub subject; independent of paid runtime.
  WorkerSubnetId: {Type: 'AWS::EC2::Subnet::Id'}
  WorkerSecurityGroupId: {Type: 'AWS::EC2::SecurityGroup::Id'}
  LaunchTemplateId: {Type: String, AllowedPattern: 'lt-[0-9a-f]{17}', Description: Reviewed external launch template referencing this stack worker
      profile; disabled creation may use placeholder pins until reviewed setup finishes.}
  LaunchTemplateVersion: {Type: String, AllowedPattern: '[1-9][0-9]*'}
  WorkerAmiId: {Type: 'AWS::EC2::Image::Id', AllowedPattern: 'ami-[0-9a-f]{17}'}
  WorkerSourceRevision: {Type: String, AllowedPattern: '[0-9a-f]{40}'}
  CodeBucket: {Type: String, AllowedPattern: '[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]', Description: Existing versioned bucket containing the reviewed
      Lambda package.}
  CodeKey: {Type: String, MinLength: 1}
  CodeObjectVersion: {Type: String, MinLength: 1, AllowedPattern: '(?!null$).+', Description: Exact immutable S3 version; unversioned code is
      rejected.}
  GitHubOidcProviderArn: {Type: String, AllowedPattern: 'arn:aws:iam::[0-9]{12}:oidc-provider/token.actions.githubusercontent.com'}
  AdmissionAudience: {Type: String, Default: rcp-production-benchmark-admission, AllowedPattern: '[A-Za-z0-9][A-Za-z0-9:/._-]{7,199}', Description: Exact
      second GitHub OIDC token audience; AWS role assumption still uses sts.amazonaws.com.}
  GitHubAppClientId:
    Type: String
    Default: ''
    AllowedPattern: '(|[A-Za-z0-9][A-Za-z0-9_.-]{0,99})'
    Description: Non-secret client ID of the separately approved owner-only GitHub App; empty keeps credential access absent.
  GitHubAppInstallationId:
    Type: String
    Default: ''
    AllowedPattern: '(|[1-9][0-9]{0,19})'
    Description: Non-secret exact installation ID selected only for wykurz/rcp.
  GitHubAppSecretSuffix:
    Type: String
    Default: ''
    AllowedPattern: '(|[A-Za-z0-9]{6})'
    Description: Six-character suffix of the external /rcp/production/github-read-app secret in this deployment account and region; this template never creates or receives the key.
Rules:
  GitHubAppRequiredForRuntime:
    RuleCondition:
      Fn::Or:
      - Fn::Equals: [{Ref: RuntimeEnabled}, 'true']
      - Fn::Equals: [{Ref: AdmissionEnabled}, 'true']
    Assertions:
    - Assert:
        Fn::And:
        - Fn::Not: [{Fn::Equals: [{Ref: GitHubAppClientId}, '']}]
        - Fn::Not: [{Fn::Equals: [{Ref: GitHubAppInstallationId}, '']}]
        - Fn::Not: [{Fn::Equals: [{Ref: GitHubAppSecretSuffix}, '']}]
      AssertDescription: Runtime or admission enablement requires all reviewed external GitHub App identifiers.
Conditions:
  GitHubAppConfigured:
    Fn::And:
    - Fn::Not: [{Fn::Equals: [{Ref: GitHubAppClientId}, '']}]
    - Fn::Not: [{Fn::Equals: [{Ref: GitHubAppInstallationId}, '']}]
    - Fn::Not: [{Fn::Equals: [{Ref: GitHubAppSecretSuffix}, '']}]
  Publishing:
    Fn::Equals:
    - {Ref: PublicationEnabled}
    - 'true'
  Enabled:
    Fn::Equals:
    - {Ref: RuntimeEnabled}
    - 'true'
  Admitting:
    Fn::And:
    - {Condition: Enabled}
    - Fn::Equals:
      - {Ref: AdmissionEnabled}
      - 'true'
Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      OwnershipControls:
        Rules:
        - {ObjectOwnership: BucketOwnerEnforced}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
        - Id: BoundProductionStaging
          Status: Enabled
          Prefix: production/staging/
          ExpirationInDays: 7
          NoncurrentVersionExpiration: {NoncurrentDays: 1}
          AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
        - Id: BoundProductionInstances
          Status: Enabled
          Prefix: production/instances/
          ExpirationInDays: 7
          NoncurrentVersionExpiration: {NoncurrentDays: 1}
          AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
        - Id: BoundProductionRuns
          Status: Enabled
          Prefix: production/runs/
          ExpirationInDays: 90
          NoncurrentVersionExpiration: {NoncurrentDays: 1}
          AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
        - Id: BoundProductionReports
          Status: Enabled
          Prefix: production/reports/
          ExpirationInDays: 90
          NoncurrentVersionExpiration: {NoncurrentDays: 1}
          AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
        - Id: RemoveExpiredProductionDeleteMarkers
          Status: Enabled
          Prefix: production/
          ExpiredObjectDeleteMarker: true
          AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: {Ref: ArtifactBucket}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: RequireTLS
          Effect: Deny
          Principal: '*'
          Action: s3:*
          Resource:
          - {'Fn::GetAtt': [ArtifactBucket, Arn]}
          - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/*'}
          Condition:
            Bool: {'aws:SecureTransport': 'false'}
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  WorkerRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: {'Fn::Sub': '${ResourcePrefix}-worker'}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal: {Service: ec2.amazonaws.com}
          Action: sts:AssumeRole
      Policies:
      - PolicyName: OneInstanceMailbox
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: s3:GetObject
            Resource:
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/${!ec2:SourceInstanceArn}/input/baseline/rcp'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/${!ec2:SourceInstanceArn}/input/baseline/rcpd'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/${!ec2:SourceInstanceArn}/input/baseline/filegen'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/${!ec2:SourceInstanceArn}/input/candidate/rcp'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/${!ec2:SourceInstanceArn}/input/candidate/rcpd'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/${!ec2:SourceInstanceArn}/input/candidate/filegen'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/${!ec2:SourceInstanceArn}/input/request.json'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/${!ec2:SourceInstanceArn}/control/window.json'}
            Condition:
              'Null': {'ec2:SourceInstanceArn': 'false'}
              ArnLike:
                ec2:SourceInstanceArn: {'Fn::Sub': 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/i-*'}
          - Effect: Allow
            Action: s3:PutObject
            Resource:
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/${!ec2:SourceInstanceArn}/output/status.json'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/${!ec2:SourceInstanceArn}/output/results.zip'}
            Condition:
              'Null': {'ec2:SourceInstanceArn': 'false'}
              ArnLike:
                ec2:SourceInstanceArn: {'Fn::Sub': 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/i-*'}
              StringEquals: {'s3:if-none-match': '*', 's3:x-amz-server-side-encryption': AES256}
  WorkerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      InstanceProfileName: {'Fn::Sub': '${ResourcePrefix}-worker'}
      Roles:
      - {Ref: WorkerRole}
  LeaseTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - {AttributeName: pk, AttributeType: S}
      KeySchema:
      - {AttributeName: pk, KeyType: HASH}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
  RuntimeScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: {'Fn::Sub': '${ResourcePrefix}-runtime'}
  SchedulerTerminationRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal: {Service: scheduler.amazonaws.com}
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount: {Ref: 'AWS::AccountId'}
            ArnEquals:
              aws:SourceArn:
              - {'Fn::GetAtt': [RuntimeScheduleGroup, Arn]}
      Policies:
      - PolicyName: TerminateManagedWorkers
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: ec2:TerminateInstances
            Resource: {'Fn::Sub': 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'}
            Condition:
              StringEquals:
                ec2:ResourceTag/rcp:namespace: {Ref: ResourcePrefix}
  CoordinatorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: {'Fn::Sub': '/aws/lambda/${ResourcePrefix}-coordinator'}
      RetentionInDays: 7
  WatchdogLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: {'Fn::Sub': '/aws/lambda/${ResourcePrefix}-watchdog'}
      RetentionInDays: 7
  CoordinatorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal: {Service: lambda.amazonaws.com}
          Action: sts:AssumeRole
      Policies:
      - PolicyName: CoordinateOneProductionOwner
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: ec2:RunInstances
            Resource:
            - {'Fn::Sub': 'arn:${AWS::Partition}:ec2:${AWS::Region}::image/${WorkerAmiId}'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${LaunchTemplateId}'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${WorkerSubnetId}'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${WorkerSecurityGroupId}'}
            Condition:
              ArnEquals:
                ec2:LaunchTemplate: {'Fn::Sub': 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${LaunchTemplateId}'}
          - Effect: Allow
            Action: ec2:RunInstances
            Resource: {'Fn::Sub': 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'}
            Condition:
              ArnEquals:
                ec2:LaunchTemplate: {'Fn::Sub': 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${LaunchTemplateId}'}
                ec2:InstanceProfile: {'Fn::GetAtt': [WorkerInstanceProfile, Arn]}
              StringEquals:
                ec2:InstanceType: c5d.24xlarge
                ec2:InstanceMarketType: on-demand
                ec2:Tenancy: default
                ec2:MetadataHttpTokens: required
                ec2:MetadataHttpEndpoint: enabled
                ec2:InstanceMetadataTags: disabled
                aws:RequestTag/rcp:namespace: {Ref: ResourcePrefix}
              NumericEquals: {'ec2:MetadataHttpPutResponseHopLimit': 1}
              StringLike: {'aws:RequestTag/rcp:run': '?*', 'aws:RequestTag/rcp:attempt': '?*', 'aws:RequestTag/rcp:deadline': '?*', 'aws:RequestTag/rcp:created-at': '?*'}
              ForAllValues:StringEquals:
                aws:TagKeys: ['rcp:namespace', 'rcp:run', 'rcp:attempt', 'rcp:deadline', 'rcp:created-at']
          - Effect: Allow
            Action: ec2:RunInstances
            Resource: {'Fn::Sub': 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*'}
            Condition:
              ArnEquals:
                ec2:LaunchTemplate: {'Fn::Sub': 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${LaunchTemplateId}'}
                ec2:Subnet: {'Fn::Sub': 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${WorkerSubnetId}'}
          - Effect: Allow
            Action: ec2:RunInstances
            Resource: {'Fn::Sub': 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*'}
            Condition:
              ArnEquals:
                ec2:LaunchTemplate: {'Fn::Sub': 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${LaunchTemplateId}'}
              StringEquals:
                ec2:VolumeType: gp3
                aws:RequestTag/rcp:namespace: {Ref: ResourcePrefix}
              NumericEquals: {'ec2:VolumeSize': 16}
              Bool: {'ec2:Encrypted': 'true'}
              StringLike: {'aws:RequestTag/rcp:run': '?*', 'aws:RequestTag/rcp:attempt': '?*', 'aws:RequestTag/rcp:deadline': '?*', 'aws:RequestTag/rcp:created-at': '?*'}
              ForAllValues:StringEquals:
                aws:TagKeys: ['rcp:namespace', 'rcp:run', 'rcp:attempt', 'rcp:deadline', 'rcp:created-at']
          - Effect: Allow
            Action: ec2:CreateTags
            Resource:
            - {'Fn::Sub': 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*'}
            Condition:
              StringEquals:
                ec2:CreateAction: RunInstances
                aws:RequestTag/rcp:namespace: {Ref: ResourcePrefix}
              ForAllValues:StringEquals:
                aws:TagKeys: ['rcp:namespace', 'rcp:run', 'rcp:attempt', 'rcp:deadline', 'rcp:created-at']
          - Effect: Allow
            Action: iam:PassRole
            Resource: {'Fn::GetAtt': [WorkerRole, Arn]}
            Condition:
              StringEquals: {'iam:PassedToService': ec2.amazonaws.com}
          - Effect: Allow
            Action: ['ec2:DescribeInstances', 'ec2:DescribeLaunchTemplateVersions']
            Resource: '*'
          - Effect: Allow
            Action: dynamodb:GetItem
            Resource: {'Fn::GetAtt': [LeaseTable, Arn]}
            Condition:
              ForAllValues:StringLike:
                dynamodb:LeadingKeys: [policy, active, guard, run#repo-655073755-run-*]
              'Null': {'dynamodb:LeadingKeys': 'false'}
          - Effect: Allow
            Action: dynamodb:ConditionCheckItem
            Resource: {'Fn::GetAtt': [LeaseTable, Arn]}
            Condition:
              ForAllValues:StringLike:
                dynamodb:LeadingKeys: [policy, active]
              'Null': {'dynamodb:LeadingKeys': 'false'}
          - Effect: Allow
            Action: dynamodb:UpdateItem
            Resource: {'Fn::GetAtt': [LeaseTable, Arn]}
            Condition:
              ForAllValues:StringLike:
                dynamodb:LeadingKeys: [run#repo-655073755-run-*]
              'Null': {'dynamodb:LeadingKeys': 'false', 'dynamodb:Attributes': 'false'}
              ForAnyValue:StringEquals:
                dynamodb:EnclosingOperation: [TransactWriteItems]
              ForAllValues:StringEquals:
                dynamodb:Attributes: [pk, epoch, revision, closed, terminal, state]
          - Effect: Allow
            Action: s3:GetObjectVersion
            Resource:
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/staging/repo-655073755-run-*/baseline/rcp'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/staging/repo-655073755-run-*/baseline/rcpd'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/staging/repo-655073755-run-*/baseline/filegen'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/staging/repo-655073755-run-*/candidate/rcp'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/staging/repo-655073755-run-*/candidate/rcpd'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/staging/repo-655073755-run-*/candidate/filegen'}
          - Effect: Allow
            Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
            Resource: {'Fn::Sub': 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ResourcePrefix}-coordinator:log-stream:*'}
  WatchdogRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal: {Service: lambda.amazonaws.com}
          Action: sts:AssumeRole
      Policies:
      - PolicyName: GuardProductionOwner
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: ec2:TerminateInstances
            Resource: {'Fn::Sub': 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'}
            Condition:
              StringEquals:
                ec2:ResourceTag/rcp:namespace: {Ref: ResourcePrefix}
          - Effect: Allow
            Action: ['ec2:DescribeInstances', 'ec2:DescribeVolumes']
            Resource: '*'
          - Effect: Allow
            Action: ['scheduler:CreateSchedule', 'scheduler:GetSchedule']
            Resource: {'Fn::Sub': 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${RuntimeScheduleGroup}/*'}
          - Effect: Allow
            Action: iam:PassRole
            Resource: {'Fn::GetAtt': [SchedulerTerminationRole, Arn]}
            Condition:
              StringEquals: {'iam:PassedToService': scheduler.amazonaws.com}
          - Effect: Allow
            Action: dynamodb:GetItem
            Resource: {'Fn::GetAtt': [LeaseTable, Arn]}
            Condition:
              ForAllValues:StringLike:
                dynamodb:LeadingKeys: [policy, active, run#repo-655073755-run-*]
              'Null': {'dynamodb:LeadingKeys': 'false'}
          - Effect: Allow
            Action: dynamodb:ConditionCheckItem
            Resource: {'Fn::GetAtt': [LeaseTable, Arn]}
            Condition:
              ForAllValues:StringLike:
                dynamodb:LeadingKeys: [active]
              'Null': {'dynamodb:LeadingKeys': 'false'}
          - Effect: Allow
            Action: dynamodb:UpdateItem
            Resource: {'Fn::GetAtt': [LeaseTable, Arn]}
            Condition:
              ForAllValues:StringLike:
                dynamodb:LeadingKeys: [run#repo-655073755-run-*]
              'Null': {'dynamodb:LeadingKeys': 'false', 'dynamodb:Attributes': 'false'}
              ForAnyValue:StringEquals:
                dynamodb:EnclosingOperation: [TransactWriteItems]
              ForAllValues:StringEquals:
                dynamodb:Attributes: [pk, epoch, revision, closed, terminal, state]
          - Effect: Allow
            Action: dynamodb:PutItem
            Resource: {'Fn::GetAtt': [LeaseTable, Arn]}
            Condition:
              ForAllValues:StringLike:
                dynamodb:LeadingKeys: [guard]
              'Null': {'dynamodb:LeadingKeys': 'false'}
          - Effect: Allow
            Action: s3:GetObjectVersion
            Resource:
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/staging/repo-655073755-run-*/baseline/rcp'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/staging/repo-655073755-run-*/baseline/rcpd'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/staging/repo-655073755-run-*/baseline/filegen'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/staging/repo-655073755-run-*/candidate/rcp'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/staging/repo-655073755-run-*/candidate/rcpd'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/staging/repo-655073755-run-*/candidate/filegen'}
          - Effect: Allow
            Action: s3:GetObject
            Resource:
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*/input/baseline/rcp'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*/input/baseline/rcpd'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*/input/baseline/filegen'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*/input/candidate/rcp'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*/input/candidate/rcpd'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*/input/candidate/filegen'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*/input/request.json'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*/control/window.json'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*/output/status.json'}
          - Effect: Allow
            Action: s3:ListBucket
            Resource: {'Fn::GetAtt': [ArtifactBucket, Arn]}
            Condition:
              StringLike:
                s3:prefix: {'Fn::Sub': 'production/instances/arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*/output/status.json'}
              NumericEquals: {'s3:max-keys': 1}
          - Effect: Allow
            Action: s3:PutObject
            Resource:
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*/input/baseline/rcp'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*/input/baseline/rcpd'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*/input/baseline/filegen'}
            - {'Fn::Sub': 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/production/instances/arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*/input/candidate/rcp'}
