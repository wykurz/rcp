    Type: AWS::IAM::RolePolicy
    Condition: GitHubAppConfigured
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RoleName: {Ref: CollectorRole}
      PolicyName: GitHubReadAppCredential
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: secretsmanager:GetSecretValue
          Resource: {'Fn::Sub': 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/rcp/production/github-read-app-${GitHubAppSecretSuffix}'}
          Condition:
            StringEquals: {secretsmanager:VersionStage: AWSCURRENT}
  CollectorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: {'Fn::Sub': '/aws/lambda/${ResourcePrefix}-collector'}
      RetentionInDays: 7
  CollectorFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: CollectorLogGroup
    Properties:
      FunctionName: {'Fn::Sub': '${ResourcePrefix}-collector'}
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: infra.aws_benchmark.production_collection_handler.lambda_handler
      Role: {'Fn::GetAtt': [CollectorRole, Arn]}
      Code:
        S3Bucket: {Ref: CodeBucket}
        S3Key: {Ref: CodeKey}
        S3ObjectVersion: {Ref: CodeObjectVersion}
      Timeout: 180
      MemorySize: 512
      ReservedConcurrentExecutions: {'Fn::If': [Enabled, 1, 0]}
      Environment:
        Variables:
