  CoordinatorMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal: {Service: states.amazonaws.com}
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount: {Ref: 'AWS::AccountId'}
            ArnEquals:
              aws:SourceArn: {'Fn::Sub': 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ResourcePrefix}-capacity'}
      Policies:
      - PolicyName: InvokeCoordinator
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: {'Fn::GetAtt': [CoordinatorFunction, Arn]}
  CoordinatorStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: {'Fn::Sub': '${ResourcePrefix}-capacity'}
      StateMachineType: STANDARD
      RoleArn: {'Fn::GetAtt': [CoordinatorMachineRole, Arn]}
      LoggingConfiguration: {Level: 'OFF', IncludeExecutionData: false}
      TracingConfiguration: {Enabled: false}
      Definition:
        Comment: One authenticated repository/run reservation; independent expiry guard remains separate from admission.
        TimeoutSeconds: 57600
        StartAt: Observe
        States:
          Observe:
            Type: Task
            Resource: {'Fn::GetAtt': [CoordinatorFunction, Arn]}
            Parameters: {run.$: $.run, execution_arn.$: $$.Execution.Id, execution_name.$: $$.Execution.Name, run_key.$: $.run_key, epoch.$: $.epoch}
            ResultPath: $.observation
            TimeoutSeconds: 50
            Retry:
            - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.ClientExecutionTimeoutException,
                Lambda.TooManyRequestsException, Sandbox.Timedout, Lambda.Unknown, States.Timeout]
              IntervalSeconds: 2
              BackoffRate: 2
              MaxAttempts: 6
              MaxDelaySeconds: 30
              JitterStrategy: FULL
            Catch:
            - ErrorEquals: [States.ALL]
              ResultPath: $.error
              Next: Failed
            Next: Decision
          Decision:
            Type: Choice
            Choices:
            - {Variable: $.observation.state, StringEquals: wait, Next: Pause}
            - {Variable: $.observation.state, StringEquals: complete, Next: Complete}
            Default: Failed
          Pause: {Type: Wait, Seconds: 60, Next: Observe}
          Complete: {Type: Succeed}
          Failed: {Type: Fail, Error: DurableLeaseIncomplete, Cause: Inspect the lease receipt and independent cleanup; do not resubmit blindly.}
