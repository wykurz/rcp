          RCP_DURABLE_REGION: {Ref: 'AWS::Region'}
          RCP_DURABLE_ACCOUNT: {Ref: 'AWS::AccountId'}
          RCP_DURABLE_NAMESPACE: {Ref: ResourcePrefix}
          RCP_DURABLE_SUBNET: {Ref: WorkerSubnetId}
          RCP_DURABLE_SECURITY_GROUP: {Ref: WorkerSecurityGroupId}
          RCP_DURABLE_PROFILE_ARN: {'Fn::GetAtt': [WorkerInstanceProfile, Arn]}
          RCP_DURABLE_BUCKET: {Ref: ArtifactBucket}
          RCP_DURABLE_LT_ID: {Ref: LaunchTemplateId}
          RCP_DURABLE_LT_VERSION: {Ref: LaunchTemplateVersion}
          RCP_DURABLE_AMI: {Ref: WorkerAmiId}
          RCP_DURABLE_SOURCE: {Ref: WorkerSourceRevision}
          RCP_DURABLE_RUNTIME_GROUP: {Ref: RuntimeScheduleGroup}
          RCP_DURABLE_TERMINATION_ROLE: {'Fn::GetAtt': [SchedulerTerminationRole, Arn]}
          RCP_PRODUCTION_ENABLED: {'Fn::If': [Enabled, 'true', 'false']}
          RCP_PRODUCTION_GITHUB_APP_CLIENT_ID: {Ref: GitHubAppClientId}
          RCP_PRODUCTION_GITHUB_APP_INSTALLATION_ID: {Ref: GitHubAppInstallationId}
          RCP_PRODUCTION_GITHUB_APP_SECRET_ARN: {'Fn::If': [GitHubAppConfigured, {'Fn::Sub': 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/rcp/production/github-read-app-${GitHubAppSecretSuffix}'}, '']}
          RCP_PRODUCTION_REPOSITORY: wykurz/rcp
          RCP_PRODUCTION_REPOSITORY_ID: '655073755'
          RCP_PRODUCTION_OWNER_ID: '483465'
          RCP_PRODUCTION_MACHINE_ARN: {Ref: CoordinatorStateMachine}
  CollectorRule:
    Type: AWS::Events::Rule
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Collect and retain the active completed run; never submits a benchmark. Disabled initially.
      ScheduleExpression: rate(5 minutes)
      State: {'Fn::If': [Enabled, ENABLED, DISABLED]}
      Targets:
      - Id: collector
        Arn: {'Fn::GetAtt': [CollectorFunction, Arn]}
        Input: '{}'
        RetryPolicy: {MaximumEventAgeInSeconds: 60, MaximumRetryAttempts: 0}
  CollectorPermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: {Ref: CollectorFunction}
      Principal: events.amazonaws.com
      SourceArn: {'Fn::GetAtt': [CollectorRule, Arn]}
      SourceAccount: {Ref: 'AWS::AccountId'}
  CollectorAsyncPolicy:
    Type: AWS::Lambda::EventInvokeConfig
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: {Ref: CollectorFunction}
      Qualifier: $LATEST
      MaximumEventAgeInSeconds: 60
      MaximumRetryAttempts: 0
