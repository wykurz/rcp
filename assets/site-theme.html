<style id="site-colors">
  :root {
    color-scheme: dark;
    --background: #000;
    --surface: #101010;
    --surface-raised: #1b1b1b;
    --text: #f5f5f5;
    --muted: #b8b8bd;
    --border: #38383d;
    --rule: #86868c;
    --link: #e07b85;
    --link-hover: #ffabb2;
    --accent: #811c2a;
    --accent-hover: #a4293a;
    --focus: #ed919a;
    --success-background: #113b27;
    --success-text: #9bd6b3;
    --warning-background: #3f2d0a;
    --warning-text: #f3cd74;
    --error-background: #43151b;
    --error-text: #ffb3b8;
    color: var(--text);
    background: var(--background);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --background: #fff;
    --surface: #fafafa;
    --surface-raised: #f2f3f5;
    --text: #20242a;
    --muted: #535b66;
    --border: #d8d8dd;
    --rule: #20242a;
    --link: #9b1c31;
    --link-hover: #661120;
    --focus: #b52f44;
    --success-background: #dcf3e7;
    --success-text: #17634c;
    --warning-background: #fff1cd;
    --warning-text: #815c05;
    --error-background: #fee5e0;
    --error-text: #a43c31;
  }
  a { color: var(--link); text-underline-offset: .18em; }
  a:hover { color: var(--link-hover); }
  :where(a, button, select, summary):focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
  .theme-toggle { border: 1px solid var(--accent-hover); border-radius: 5px; background: var(--accent); color: #fff; padding: .45rem .8rem; font: inherit; font-size: .85rem; line-height: 1.4; white-space: nowrap; cursor: pointer; }
  .theme-toggle:hover { background: var(--accent-hover); }
</style>
<script id="site-theme">
  (() => {
    const root = document.documentElement;
    let theme = 'dark';
    const restore = () => {
      try {
        theme = localStorage.getItem('rcp-site-theme') === 'light' ? 'light' : 'dark';
      } catch (_) { /* storage may be unavailable for local files or restricted browsers */ }
      root.dataset.theme = theme;
    };
    restore();
    document.addEventListener('DOMContentLoaded', () => {
      const button = document.querySelector('[data-theme-toggle]');
      if (!button) return;
      const label = () => {
        button.textContent = theme === 'dark' ? 'Light theme' : 'Dark theme';
        button.setAttribute('aria-label', `Switch to ${theme === 'dark' ? 'light' : 'dark'} theme`);
      };
      button.addEventListener('click', () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = theme;
        label();
        try {
          localStorage.setItem('rcp-site-theme', theme);
        } catch (_) { /* switching still works when the preference cannot be saved */ }
      });
      label();
      button.hidden = false;
      window.addEventListener('pageshow', event => {
        if (event.persisted) {
          restore();
          label();
        }
      });
    });
  })();
</script>
