version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-actions:
        patterns:
          - "*"

  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-nix:
        patterns:
          - "*"

# There is deliberately no `cargo` ecosystem here. `.github/workflows/cargo-update.yml` does that
# job instead, because Dependabot has no MSRV awareness for cargo (dependabot-core#5423): it always
# offers the newest version, so a crate raising its `rust-version` past ours failed the `msrv` job
# and blocked every other bump in the batch until someone hand-wrote an `ignore` entry. That
# happened twice, for `sysinfo` and `enum-map`. The replacement derives the same constraint from
# `rust-version` on every run, and a hold-back releases itself once the MSRV is raised.
#
# Dependabot SECURITY updates for cargo are configured separately from these version updates and
# are unaffected by the absence of this entry.
