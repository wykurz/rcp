name: Verify protected AWS benchmark history

# this separate live acceptance lane requires its own exact approval before enabling.
on:
  workflow_dispatch:
    inputs:
      probe_id:
        description: Approved unique 16-hex probe ID (names two disposable control branches)
        required: true
        type: string
      trust_sha256:
        description: SHA256 of the operator-verified trust readback receipt
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'wykurz/rcp' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor_id == '483465' && github.run_attempt == '1' && vars.RCP_AWS_HISTORY_CANARY_ENABLED == 'true' && vars.RCP_AWS_HISTORY_TRUST_READY == 'false' && vars.RCP_AWS_PRODUCTION_PUBLISH_ENABLED == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: aws-benchmark-history
    permissions:
      contents: write
    concurrency:
      group: aws-production-history-publish
      cancel-in-progress: false
    env:
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_TERMINAL_PROMPT: '0'
      PROBE_ID: ${{ inputs.probe_id }}
      TRUST_SHA256: ${{ inputs.trust_sha256 }}
      CANARY_ENABLED: ${{ vars.RCP_AWS_HISTORY_CANARY_ENABLED }}
      TRUST_READY: ${{ vars.RCP_AWS_HISTORY_TRUST_READY }}
      PUBLISH_ENABLED: ${{ vars.RCP_AWS_PRODUCTION_PUBLISH_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the reviewed main canary after approval
        run: |
          python3 - <<'PY'
          import os
          from infra.aws_benchmark.common import require
          from infra.aws_benchmark.history_contract import CANARY_WORKFLOW
          from infra.aws_benchmark.history_canary import identity
          from infra.aws_benchmark.publication_identity import check_identity, current_main
          check_identity(os.environ, workflow=CANARY_WORKFLOW)
          require(os.environ['CANARY_ENABLED'] == 'true' and os.environ['TRUST_READY'] == 'false' and os.environ['PUBLISH_ENABLED'] == 'false', 'Canary flags differ; reject pending approvals when closing flags')
          identity(os.environ['PROBE_ID'], os.environ['TRUST_SHA256'], os.environ['GITHUB_SHA'])
          current_main(os.environ['GITHUB_SHA'])
          PY
      - name: Prove ordinary write authority and protected bootstrap denial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m infra.aws_benchmark.history_canary ordinary \
            --probe "$PROBE_ID" --trust-sha256 "$TRUST_SHA256" --revision "$GITHUB_SHA" \
            --directory "$RUNNER_TEMP/canary.git" --evidence "$RUNNER_TEMP/canary.jsonl"
      - name: Recheck current main before minting
        run: |
          python3 - <<'PY'
          import os
          from infra.aws_benchmark.publication_identity import current_main
          current_main(os.environ['GITHUB_SHA'])
          PY
      - name: Mint only after ordinary controls pass
        id: writer
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RCP_AWS_HISTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.RCP_AWS_HISTORY_APP_PRIVATE_KEY }}
          owner: wykurz
          repositories: rcp
          permission-contents: write
          permission-metadata: read
          skip-token-revoke: false
      - name: Verify installation continuity and empty-tree protection
        env:
          GH_TOKEN: ${{ github.token }}
          WRITER_TOKEN: ${{ steps.writer.outputs.token }}
          ACTUAL_INSTALLATION: ${{ steps.writer.outputs.installation-id }}
          EXPECTED_INSTALLATION: ${{ vars.RCP_AWS_HISTORY_APP_INSTALLATION_ID }}
        run: |
          python3 - <<'PY'
          import os
          from infra.aws_benchmark.common import require
          from infra.aws_benchmark.production_trust import identifier
          from infra.aws_benchmark.publication_identity import current_main
          require(identifier(os.environ['EXPECTED_INSTALLATION']) == identifier(os.environ['ACTUAL_INSTALLATION']), 'Installation continuity differs')
          current_main(os.environ['GITHUB_SHA'])
          PY
          python3 -m infra.aws_benchmark.history_canary writer \
            --probe "$PROBE_ID" --trust-sha256 "$TRUST_SHA256" --revision "$GITHUB_SHA" \
            --directory "$RUNNER_TEMP/canary.git" --evidence "$RUNNER_TEMP/canary.jsonl"
      - name: Preserve bounded public canary evidence on success or hold
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-history-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canary.jsonl
          retention-days: 7
          if-no-files-found: warn
