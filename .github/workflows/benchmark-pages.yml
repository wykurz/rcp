name: Benchmark history and reports

on:
  workflow_call:
    inputs:
      aws_history_commit:
        description: Exact public history commit returned by the successful history writer
        type: string
        required: true
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: benchmark-pages-publish
  cancel-in-progress: false

jobs:
  # report tests and link validation run on every PR through the required lint job
  publish:
    # enable after selecting GitHub Actions as the repository's Pages source
    if: github.repository == 'wykurz/rcp' && github.ref == 'refs/heads/main' && vars.RCP_BENCHMARK_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pin current main for this site
        id: source
        timeout-minutes: 1
        env:
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git -c credential.helper= ls-remote --exit-code --heads https://github.com/wykurz/rcp.git refs/heads/main > "$RUNNER_TEMP/pages-source-ref"
          python3 - "$RUNNER_TEMP/pages-source-ref" <<'PY'
          import os, re, sys
          from pathlib import Path
          refs = [line.split('\t') for line in Path(sys.argv[1]).read_text().splitlines()]
          commits = [fields[0] for fields in refs if len(fields) == 2 and fields[1] == 'refs/heads/main']
          assert len(commits) == 1 and re.fullmatch(r'[0-9a-f]{40}', commits[0]), 'Invalid exact main reference'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + commits[0] + '\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: benchmark-history
          path: benchmark-history-data
          persist-credentials: false
      - uses: ./.depot/actions/setup-report-python
      - name: Read the pinned AWS public history without checking out data
        if: vars.RCP_AWS_PRODUCTION_PUBLISH_ENABLED == 'true'
        id: aws_history
        timeout-minutes: 2
        env:
          AWS_HISTORY_COMMIT: ${{ inputs.aws_history_commit }}
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: '0'
        run: |
          history="$RUNNER_TEMP/aws-pages-history.git"
          git init --bare "$history"
          commit="$AWS_HISTORY_COMMIT"
          if test -z "$commit"; then
            if git -c credential.helper= ls-remote --exit-code --heads https://github.com/wykurz/rcp.git refs/heads/aws-benchmark-history > "$RUNNER_TEMP/aws-pages-ref"; then
              commit=$(python3 - "$RUNNER_TEMP/aws-pages-ref" <<'PY'
          import re, sys
          from pathlib import Path
          refs = [line.split('\t') for line in Path(sys.argv[1]).read_text().splitlines()]
          commits = [fields[0] for fields in refs if len(fields) == 2 and fields[1] == 'refs/heads/aws-benchmark-history']
          assert len(commits) <= 1, 'Ambiguous exact AWS history reference'
          if commits:
              assert re.fullmatch(r'[0-9a-f]{40}', commits[0]), 'Invalid exact AWS history reference'
              print(commits[0])
          PY
              )
            else
              code=$?
              test "$code" -eq 2
            fi
          fi
          if test -n "$commit"; then
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
            git -c credential.helper= --git-dir="$history" fetch --no-tags --depth=1 https://github.com/wykurz/rcp.git "$commit"
            test "$(git --git-dir="$history" rev-parse --verify 'FETCH_HEAD^{commit}')" = "$commit"
            git --git-dir="$history" update-ref refs/heads/aws-benchmark-history "$commit"
          fi
          echo "path=$history" >> "$GITHUB_OUTPUT"
      - name: Render history using trusted main-branch code
        id: render
        run: python3 -m benchmarks.report benchmark-history-data --output _site/ci-benchmarks --reports-url ../reports/index.html
      - name: Render project landing page and maintained reports
        env:
          AWS_HISTORY: ${{ steps.aws_history.outputs.path }}
        run: |
          args=()
          if test -n "$AWS_HISTORY"; then args+=(--aws-history "$AWS_HISTORY"); fi
          python3 scripts/report_site.py --output _site --with-benchmark-history "${args[@]}"
      # package directly because upload-pages-artifact pins its nested action to a tag
      - name: Package project site for Pages
        id: package
        run: >-
          tar --dereference --hard-dereference --directory _site
          -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      # serialize deployments and recheck the pinned render source immediately before publishing
      # a concurrent merge must produce a visible retry request instead of a green skipped update
      - name: Check that this site still belongs to current main
        id: current_main
        timeout-minutes: 1
        env:
          PAGES_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git -c credential.helper= ls-remote --exit-code --heads https://github.com/wykurz/rcp.git refs/heads/main > "$RUNNER_TEMP/pages-main-ref"
          python3 - "$RUNNER_TEMP/pages-main-ref" <<'PY'
          import os, re, sys
          from pathlib import Path
          refs = [line.split('\t') for line in Path(sys.argv[1]).read_text().splitlines()]
          commits = [fields[0] for fields in refs if len(fields) == 2 and fields[1] == 'refs/heads/main']
          assert len(commits) == 1 and re.fullmatch(r'[0-9a-f]{40}', commits[0]), 'Invalid exact main reference'
          source = os.environ['PAGES_SOURCE_COMMIT']
          assert re.fullmatch(r'[0-9a-f]{40}', source), 'Invalid pinned Pages source'
          current = commits[0] == source
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('current=' + str(current).lower() + '\n')
          if not current:
              message = (f'Pages deployment blocked: main advanced from {source} to {commits[0]}. '
                         'Re-run this workflow to render current main with the same pinned history.')
              print('::error::' + message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(message + '\n')
              raise SystemExit(1)
          PY
      - name: Deploy project site
        if: steps.current_main.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Summarize historical changes
        if: always() && steps.render.outcome == 'success'
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from benchmarks import changes
          evidence = json.loads(Path("_site/ci-benchmarks/changes.json").read_text(encoding="utf-8"))
          site_url = os.environ.get("REPORT_URL")
          history_url = site_url.rstrip("/") + "/ci-benchmarks/" if site_url else None
          report = changes.markdown(evidence, link_base=history_url)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(report)
          PY
