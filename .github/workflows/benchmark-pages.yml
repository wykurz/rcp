name: Benchmark history and reports

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: benchmark-pages-publish
  cancel-in-progress: false

jobs:
  # report tests and link validation run on every PR through the required lint job
  publish:
    # enable after selecting GitHub Actions as the repository's Pages source
    if: vars.RCP_BENCHMARK_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: benchmark-history
          path: benchmark-history-data
          persist-credentials: false
      - uses: ./.depot/actions/setup-report-python
      - name: Render history using trusted main-branch code
        id: render
        run: python3 -m benchmarks.report benchmark-history-data --output _site/ci-benchmarks --reports-url ../reports/index.html
      - name: Render project landing page and maintained reports
        run: python3 scripts/report_site.py --output _site --with-benchmark-history
      # package directly because upload-pages-artifact pins its nested action to a tag
      - name: Package project site for Pages
        id: package
        run: >-
          tar --dereference --hard-dereference --directory _site
          -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Deploy project site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Summarize historical changes
        if: always() && steps.render.outcome == 'success'
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from benchmarks import changes
          evidence = json.loads(Path("_site/ci-benchmarks/changes.json").read_text(encoding="utf-8"))
          site_url = os.environ.get("REPORT_URL")
          history_url = site_url.rstrip("/") + "/ci-benchmarks/" if site_url else None
          report = changes.markdown(evidence, link_base=history_url)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(report)
          PY
