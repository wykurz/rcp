name: Benchmark history and reports

on:
  workflow_call:
    inputs:
      aws_records_artifact:
        description: Exact immutable public-record artifact ID from this run
        type: string
        required: true
      aws_inventory_sha256:
        description: Inventory digest from the trusted read-only predecessor
        type: string
        required: true
      aws_reader_revision:
        description: Exact main source SHA that read and validated the frozen records
        type: string
        required: true
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: benchmark-pages-publish
  cancel-in-progress: false

env:
  PAGES_ENABLED: ${{ vars.RCP_BENCHMARK_PAGES }}
  PUBLICATION_ENABLED: ${{ vars.RCP_AWS_PRODUCTION_PUBLISH_ENABLED }}
  PUBLISH_SCHEDULE_ENABLED: ${{ vars.RCP_AWS_PRODUCTION_PUBLISH_SCHEDULE_ENABLED }}
  EXPECTED_ARTIFACT: ${{ inputs.aws_records_artifact }}
  EXPECTED_INVENTORY: ${{ inputs.aws_inventory_sha256 }}
  EXPECTED_READER: ${{ inputs.aws_reader_revision }}
  GIT_CONFIG_NOSYSTEM: '1'
  GIT_CONFIG_GLOBAL: /dev/null
  GIT_TERMINAL_PROMPT: '0'

jobs:
  render:
    # while AWS reporting is enabled, docs-only pushes must preserve the AWS dashboard
    if: github.repository == 'wykurz/rcp' && github.repository_id == '655073755' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && vars.RCP_BENCHMARK_PAGES == 'true' && ((inputs.aws_records_artifact != '' && vars.RCP_AWS_PRODUCTION_PUBLISH_ENABLED == 'true') || (inputs.aws_records_artifact == '' && vars.RCP_AWS_PRODUCTION_PUBLISH_ENABLED != 'true'))
    runs-on: ubuntu-24.04
    cache-mode: none
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      current: ${{ steps.current.outputs.current }}
      artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind site mode and current main before reading artifacts
        id: source
        run: python3 -B -m infra.aws_benchmark.production_reports site-gate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.source.outputs.current == 'true'
        with:
          ref: benchmark-history
          path: benchmark-history-data
          persist-credentials: false
      - uses: ./.depot/actions/setup-report-python
        if: steps.source.outputs.current == 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.source.outputs.current == 'true' && inputs.aws_records_artifact != ''
        with:
          artifact-ids: ${{ inputs.aws_records_artifact }}
          path: ${{ runner.temp }}/public-records
          merge-multiple: true
          digest-mismatch: error
      - name: Verify the exact predecessor and complete retained view without cloud credentials
        if: steps.source.outputs.current == 'true' && inputs.aws_records_artifact != ''
        run: |
          python3 -B -m infra.aws_benchmark.production_reports inspect \
            --input "$RUNNER_TEMP/public-records" --reader-revision "$EXPECTED_READER" \
            --expected-sha256 "$EXPECTED_INVENTORY" --require-complete
      - name: Render history using trusted main-branch code
        if: steps.source.outputs.current == 'true'
        id: render
        run: python3 -m benchmarks.report benchmark-history-data --output _site/ci-benchmarks --reports-url ../reports/index.html
      - name: Render project landing page and maintained reports
        if: steps.source.outputs.current == 'true'
        run: |
          args=()
          if test -n "$EXPECTED_ARTIFACT"; then
            args+=(--aws-records "$RUNNER_TEMP/public-records" --aws-reader-revision "$EXPECTED_READER" --aws-inventory-sha256 "$EXPECTED_INVENTORY")
          fi
          python3 scripts/report_site.py --output _site --with-benchmark-history "${args[@]}"
      - name: Summarize historical changes
        if: always() && steps.render.outcome == 'success'
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          from benchmarks import changes
          evidence = json.loads(Path("_site/ci-benchmarks/changes.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(changes.markdown(evidence, link_base=None))
          PYCODE
      - name: Check current main again before packaging
        if: steps.source.outputs.current == 'true'
        id: current
        run: python3 -B -m infra.aws_benchmark.production_reports site-gate
      # the job owns _site and executes no retained HTML or source from the data artifact
      - name: Package project site for Pages
        id: package
        if: steps.current.outputs.current == 'true'
        run: >-
          tar --dereference --hard-dereference --directory _site
          -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.current.outputs.current == 'true'
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: render
    if: needs.render.outputs.current == 'true'
    runs-on: ubuntu-24.04
    cache-mode: none
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require current main and the same publication mode after the deployment gate
        id: current
        run: python3 -B -m infra.aws_benchmark.production_reports site-gate
      # deploy-pages selects by unique immutable name in this workflow run; it has no artifact-id input
      - name: Deploy project site
        if: steps.current.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.render.outputs.artifact_name }}
