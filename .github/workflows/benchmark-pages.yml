name: Benchmark history

on:
  repository_dispatch:
    types: [benchmark-history-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-pages
  cancel-in-progress: false

jobs:
  publish:
    # enable after selecting GitHub Actions as the repository's Pages source
    if: vars.RCP_BENCHMARK_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: benchmark-history
          path: benchmark-history-data
          persist-credentials: false
      - name: Render history using trusted main-branch code
        run: python3 -m benchmarks.report benchmark-history-data --output _site
      # package directly because upload-pages-artifact pins its nested action to a tag
      - name: Package dashboard for Pages
        run: >-
          tar --dereference --hard-dereference --directory _site
          -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
