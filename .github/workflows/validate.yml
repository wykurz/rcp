name: Validate

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (tag, branch, or SHA). Defaults to the triggering ref.'
        required: false
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --cfg tokio_unstable

# Least-privilege GITHUB_TOKEN: every job here only checks out and builds/tests
# the repo, so read access to contents is all that's needed.
permissions:
  contents: read

jobs:
  lint-and-docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.sha }}

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      with:
        components: rustfmt, clippy
        target: x86_64-unknown-linux-musl

    - name: Install musl toolchain deps
      run: |
        sudo apt-get update
        sudo apt-get install -y jq musl-tools pkg-config python3-yaml
        sudo ln -sf /usr/bin/musl-gcc /usr/bin/x86_64-unknown-linux-musl-gcc

    - name: Install just
      uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
      with:
        tool: just

    - name: Format
      run: ./scripts/cargo-host.sh fmt --check

    # The CLI version is pinned here for reproducibility, but formatting output
    # is determined by the plugin version + checksum pinned in dprint.json.
    - name: Install dprint
      run: |
        curl -fsSL -o /tmp/dprint.zip https://github.com/dprint/dprint/releases/download/0.54.0/dprint-x86_64-unknown-linux-gnu.zip
        echo "8cb5925a0d6d0d8aa74c82a00f76734577592dfa1eda9517c261a84fe06accd7  /tmp/dprint.zip" | sha256sum -c -
        mkdir -p "$HOME/.local/bin"
        unzip -o -q /tmp/dprint.zip -d "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Check markdown formatting
      run: ./scripts/check-doc-format.sh

    # Runs BEFORE the linter it tests, so a linter that has stopped detecting anything fails here
    # rather than passing quietly below. The fixtures pin both directions — every marked violation
    # reported, nothing in the clean fixture reported — and they also catch a linter whose awk program
    # will not parse, which otherwise produces no output and so looks exactly like a clean tree.
    - name: Test the error logging linter
      run: ./scripts/test-check-error-logging.sh

    - name: Check error logging format
      run: ./scripts/check-error-logging.sh

    - name: Check anyhow::Error::msg usage
      run: ./scripts/check-anyhow-error-msg.sh

    - name: Check rust version consistency
      run: ./scripts/check-rust-version.sh

    - name: Check build target consistency
      run: |
        ./scripts/test-check-build-targets.sh
        ./scripts/check-build-targets.sh

    - name: Check build entrypoints
      run: |
        ./scripts/test-check-build-entrypoints.sh
        ./scripts/check-build-entrypoints.sh

    - name: Check walk-driver usage
      run: ./scripts/check-walk-driver-usage.sh

    - name: Check source-read fidelity
      run: ./scripts/check-source-read-fidelity.sh

    - name: Check TLS handshake timeouts
      run: ./scripts/check-tls-handshake-timeout.sh

    # Runs BEFORE the linter it tests, for the same reason as the error-logging harness above: the
    # fixtures pin both directions, so a rule that quietly stops matching fails here rather than
    # letting an unconfigured connection land below.
    - name: Test the TCP socket configuration linter
      run: ./scripts/test-check-tcp-socket-config.sh

    - name: Check TCP socket configuration
      run: ./scripts/check-tcp-socket-config.sh

    # The report filter reads `cargo update --verbose` output, a human format. If cargo reflows
    # that line the filter silently reports nothing and the monthly update still looks healthy, so
    # it has to be exercised somewhere. This job enumerates its scripts rather than running
    # `just lint`, so a new linter test needs adding in both places.
    - name: Test the update-deps MSRV report filter
      run: ./scripts/test-update-deps.sh

    - name: Test host Cargo selection
      run: ./scripts/test-cargo-host.sh

    - name: Test Docker target selection
      run: ./scripts/test-docker-target.sh

    - name: Test Docker readiness behavior
      run: ./scripts/test-docker-helpers.sh

    - name: Test Depot CI helper
      run: ./scripts/test-depot-ci.sh

    - name: Check package metadata
      run: ./scripts/check-package-metadata.sh

    - name: Lint
      run: ./scripts/cargo-host.sh clippy --workspace --all-targets -- -D warnings
      env:
        PKG_CONFIG_ALLOW_CROSS: "1"

    - name: Documentation
      run: ./scripts/cargo-host.sh doc --no-deps --workspace
      env:
        RUSTDOCFLAGS: --cfg tokio_unstable -D warnings
        PKG_CONFIG_ALLOW_CROSS: "1"

  msrv:
    runs-on: ubuntu-latest
    needs: lint-and-docs
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.sha }}

    - name: Setup Rust (MSRV)
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      with:
        toolchain: "1.91.1"
        target: x86_64-unknown-linux-musl

    - name: Install musl toolchain deps
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools pkg-config
        sudo ln -sf /usr/bin/musl-gcc /usr/bin/x86_64-unknown-linux-musl-gcc

    - name: Verify the MSRV toolchain is active
      run: |
        rustc --version
        rustc --version | grep -q "1.91.1" || { echo "::error::expected rustc 1.91.1"; exit 1; }

    # Check both shipped targets: musl (default in .cargo/config.toml) and gnu
    # (build-glibc). Each compiles a different side of the target_env = "musl"
    # cfg gates (e.g. common/src/filter.rs), so a single target would let an
    # MSRV regression in the other branch slip through.
    - name: Check workspace builds on MSRV (gnu + musl)
      run: ./scripts/cargo-host.sh check --workspace --locked --all-targets --target x86_64-unknown-linux-gnu --target x86_64-unknown-linux-musl
      env:
        PKG_CONFIG_ALLOW_CROSS: "1"

  test-musl-debug:
    runs-on: ubuntu-latest
    needs: lint-and-docs
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.sha }}

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      with:
        target: x86_64-unknown-linux-musl

    - name: Install musl toolchain deps
      run: |
        sudo apt-get update
        # strace: `all_does_not_pay_the_acl_probe` counts a traced rcp run's ACL-probe syscalls.
        # The point of making ACLs opt-in is that the default path costs nothing, and only a
        # syscall count can show that; an outcome check would pass while the cost crept back.
        sudo apt-get install -y musl-tools pkg-config strace
        sudo ln -sf /usr/bin/musl-gcc /usr/bin/x86_64-unknown-linux-musl-gcc

    - name: Setup SSH for localhost
      run: |
        sudo apt-get install -y openssh-server
        sudo systemctl start ssh
        ssh-keygen -t rsa -f ~/.ssh/id_rsa -N ""
        cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys
        chmod 600 ~/.ssh/authorized_keys
        ssh-keyscan -H localhost >> ~/.ssh/known_hosts
        # Root SSH-to-localhost, for the sudo-gated remote tests that run the WHOLE
        # rcp+rcpd chain as root (rcp spawns rcpd over ssh, so root must reach localhost
        # passwordlessly). sshd's default PermitRootLogin=prohibit-password allows key auth.
        sudo mkdir -p /root/.ssh
        sudo ssh-keygen -t rsa -f /root/.ssh/id_rsa -N ""
        sudo cp /root/.ssh/id_rsa.pub /root/.ssh/authorized_keys
        sudo chmod 600 /root/.ssh/authorized_keys
        sudo ssh-keyscan -H localhost | sudo tee /root/.ssh/known_hosts > /dev/null
        sudo ssh -o BatchMode=yes localhost true

    - name: Install cargo-nextest
      run: ./scripts/cargo-install-host.sh cargo-nextest --version 0.9.85 --locked

    - name: Test (musl debug)
      env:
        PKG_CONFIG_ALLOW_CROSS: "1"
      run: |
        set -o pipefail
        # Run tests with nextest for better output
        ./scripts/cargo-host.sh nextest run --no-capture 2>&1 | tee test_output_musl_debug.log

    - name: Test sudo-required tests (musl debug)
      env:
        PKG_CONFIG_ALLOW_CROSS: "1"
        # root SSH is provisioned above, so a missing precondition is a CI bug, not a skip
        RCP_REQUIRE_ROOT_SSH: "1"
      run: |
        set -o pipefail
        # Run tests that require passwordless sudo (available in CI)
        ./scripts/cargo-host.sh nextest run --no-capture --run-ignored only -E 'test(~sudo)' 2>&1 | tee -a test_output_musl_debug.log

    - name: Doctests (musl debug)
      env:
        PKG_CONFIG_ALLOW_CROSS: "1"
      run: ./scripts/cargo-host.sh test --doc

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-logs-musl-debug
        path: test_output_musl_debug.log

  test-musl-release:
    runs-on: ubuntu-latest
    needs: lint-and-docs
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.sha }}

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      with:
        target: x86_64-unknown-linux-musl

    - name: Install musl toolchain deps
      run: |
        sudo apt-get update
        # strace: `all_does_not_pay_the_acl_probe` counts a traced rcp run's ACL-probe syscalls.
        # The point of making ACLs opt-in is that the default path costs nothing, and only a
        # syscall count can show that; an outcome check would pass while the cost crept back.
        sudo apt-get install -y musl-tools pkg-config strace
        sudo ln -sf /usr/bin/musl-gcc /usr/bin/x86_64-unknown-linux-musl-gcc

    - name: Setup SSH for localhost
      run: |
        sudo apt-get install -y openssh-server
        sudo systemctl start ssh
        ssh-keygen -t rsa -f ~/.ssh/id_rsa -N ""
        cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys
        chmod 600 ~/.ssh/authorized_keys
        ssh-keyscan -H localhost >> ~/.ssh/known_hosts
        # Root SSH-to-localhost, for the sudo-gated remote tests that run the WHOLE
        # rcp+rcpd chain as root (rcp spawns rcpd over ssh, so root must reach localhost
        # passwordlessly). sshd's default PermitRootLogin=prohibit-password allows key auth.
        sudo mkdir -p /root/.ssh
        sudo ssh-keygen -t rsa -f /root/.ssh/id_rsa -N ""
        sudo cp /root/.ssh/id_rsa.pub /root/.ssh/authorized_keys
        sudo chmod 600 /root/.ssh/authorized_keys
        sudo ssh-keyscan -H localhost | sudo tee /root/.ssh/known_hosts > /dev/null
        sudo ssh -o BatchMode=yes localhost true

    - name: Install cargo-nextest
      run: ./scripts/cargo-install-host.sh cargo-nextest --version 0.9.85 --locked

    - name: Test (musl release)
      env:
        PKG_CONFIG_ALLOW_CROSS: "1"
      run: |
        set -o pipefail
        # Run tests with nextest in release mode
        ./scripts/cargo-host.sh nextest run --release --no-capture 2>&1 | tee test_output_musl_release.log

    - name: Test sudo-required tests (musl release)
      env:
        PKG_CONFIG_ALLOW_CROSS: "1"
        # root SSH is provisioned above, so a missing precondition is a CI bug, not a skip
        RCP_REQUIRE_ROOT_SSH: "1"
      run: |
        set -o pipefail
        # Run tests that require passwordless sudo (available in CI)
        ./scripts/cargo-host.sh nextest run --release --no-capture --run-ignored only -E 'test(~sudo)' 2>&1 | tee -a test_output_musl_release.log

    - name: Doctests (musl release)
      env:
        PKG_CONFIG_ALLOW_CROSS: "1"
      run: ./scripts/cargo-host.sh test --doc --release

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-logs-musl-release
        path: test_output_musl_release.log

  test-docker:
    runs-on: ubuntu-latest
    needs: lint-and-docs
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.sha }}

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      with:
        target: x86_64-unknown-linux-musl

    - name: Install musl toolchain deps
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools pkg-config
        sudo ln -sf /usr/bin/musl-gcc /usr/bin/x86_64-unknown-linux-musl-gcc

    - name: Install just
      uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
      with:
        tool: just

    - name: Install cargo-nextest
      uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
      with:
        tool: cargo-nextest@0.9.85

    - name: Start Docker test environment
      env:
        PKG_CONFIG_ALLOW_CROSS: "1"
      run: just docker-up

    - name: Run Docker multi-host tests
      # exclude chaos tests - they require SYS_ADMIN capability and run separately in chaos-tests.yml
      run: just docker-test-only -E 'not test(~chaos)'

    - name: Show Docker logs on failure
      if: failure()
      run: just docker-logs-once

    - name: Stop Docker containers
      if: always()
      run: just docker-down

  build-glibc:
    runs-on: ubuntu-latest
    needs: lint-and-docs
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.sha }}

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

    - name: Build all binaries (glibc)
      run: CARGO_BUILD_TARGET=x86_64-unknown-linux-gnu ./scripts/cargo-host.sh build --workspace --release

  # Validate the Nix flake and its source-owned sandbox test selection. None of the jobs above
  # touch Nix, so a flake.lock bump (Dependabot opens grouped `nix` PRs) could break `nix build`
  # or the dev shell while the rest of CI stays green. Runs in parallel -- it's independent of
  # the Rust lint/test jobs and gives fast feedback on the exact thing it guards.
  nix:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.sha }}

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

    - name: Test Nix target selection
      run: ./scripts/test-nix-targets.sh

    # `--no-build` keeps this an evaluation-only check, covering the darwin/aarch64
    # outputs this linux runner can't build. The explicit build + dev-shell steps
    # below catch build-level breakage on this system. `--no-update-lock-file` makes
    # each step validate the committed flake.lock as-is, so a flake.nix input change
    # that forgets to commit the regenerated lock fails here instead of passing
    # against a silently auto-updated lock.
    - name: Flake check (evaluate all systems)
      run: nix flake check --all-systems --no-build --no-update-lock-file -L
    - name: Build the full suite with Nix sandbox test selection
      run: nix build --no-update-lock-file -L .#rcp-all
    - name: Build the dev shell
      run: nix develop --no-update-lock-file -L --command true
