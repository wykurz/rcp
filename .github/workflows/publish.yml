name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g., v0.28.0)'
        required: true
      dry-run:
        description: 'Perform a dry run (no actual publishing)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  CARGO_TERM_COLOR: always

# Least-privilege default for every job; publish only needs read.
permissions:
  contents: read

# selected release source must neither consume nor poison shared Actions caches
cache-mode: none

jobs:
  resolve-release:
    uses: ./.github/workflows/resolve-release-tag.yml
    with:
      release_tag: ${{ inputs.release_tag }}

  validate:
    needs: resolve-release
    if: ${{ needs.resolve-release.result == 'success' }}
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.resolve-release.outputs.commit }}

  dry-run:
    runs-on: ubuntu-latest
    needs: [resolve-release, validate]
    if: ${{ needs.resolve-release.result == 'success' && inputs.dry-run == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
          persist-credentials: false

      - name: Verify version matches release tag
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Tag version: $TAG_VERSION"
          echo "Cargo version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install cargo-workspaces
        run: ./scripts/cargo-install-host.sh cargo-workspaces --version 0.4.2 --locked

      - name: Check publishing without a credential
        run: |
          # this separate job has no environment, publishing secret or OIDC permission
          cargo workspaces publish --publish-as-is --yes --no-verify --dry-run

      - name: Summary
        run: |
          echo 'Dry run completed; no packages were published to crates.io.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://github.com/wykurz/rcp/commit/${{ needs.resolve-release.outputs.commit }}
    needs: [resolve-release, validate]
    if: ${{ needs.resolve-release.result == 'success' && inputs.dry-run == 'false' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
          persist-credentials: false

      - name: Require the environment publishing credential
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_PUBLISH_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo '::error::Configure and approve the crates-io environment before publishing.' >&2
            exit 1
          fi

      - name: Verify version matches release tag
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Tag version: $TAG_VERSION"
          echo "Cargo version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install cargo-workspaces
        run: ./scripts/cargo-install-host.sh cargo-workspaces --version 0.4.2 --locked

      - name: Publish to crates.io
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_PUBLISH_TOKEN }}
        run: |
          # validation built the held source; skip the registry verification build with its musl default
          cargo workspaces publish --publish-as-is --yes --no-verify

      - name: Summary
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          if [ "$PUBLISH_OUTCOME" != 'success' ]; then
            echo '::error::Publication did not complete; inspect the publish step before retrying.' >&2
            exit 1
          fi
          echo 'Workspace packages published to crates.io.' >> "$GITHUB_STEP_SUMMARY"
