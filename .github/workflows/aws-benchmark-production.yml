name: AWS production benchmark

# Initially inert. Proposed cadence is not authority: both repository gates and server slots/budgets must be approved.
on:
  schedule:
    # proposed two-slot UTC cadence; no job runs until the separate schedule gate is true
    - cron: '17 8 * * 1,5'
    # temporary commissioning slot; remove after the approved November 8 scheduler test
    - cron: '17 7 8 11 *'
  workflow_dispatch:
    inputs:
      mode:
        description: Benchmark submission or separately approved identity-only acceptance
        type: choice
        options:
          - benchmark
          - identity-test
        default: benchmark
        required: true
      identity_approval:
        description: Nonsecret finite approval JSON for identity-test only; see PRODUCTION.md
        type: string
        required: false
      revision:
        description: Full source SHA for the initial four-copy A/A qualification (blank uses main)
        type: string
        required: false

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'wykurz/rcp' && github.repository_id == '655073755' && github.ref == 'refs/heads/main' && github.actor_id == '483465' && github.run_attempt == '1' && vars.RCP_AWS_PRODUCTION_ENABLED == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'benchmark') || (github.event_name == 'schedule' && vars.RCP_AWS_PRODUCTION_SCHEDULE_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: source
        env:
          RCP_MODE: ${{ inputs.mode || 'benchmark' }}
          RCP_REQUESTED_REVISION: ${{ inputs.revision }}
          RCP_PRODUCTION_ENABLED: ${{ vars.RCP_AWS_PRODUCTION_ENABLED }}
          RCP_SCHEDULE_ENABLED: ${{ vars.RCP_AWS_PRODUCTION_SCHEDULE_ENABLED }}
          RCP_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python3 -m infra.aws_benchmark.production_workflow

  build:
    if: github.event_name == 'schedule' || inputs.mode == 'benchmark'
    needs: validate
    runs-on: ubuntu-24.04
    cache-mode: none
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RUSTFLAGS: --cfg tokio_unstable
      PKG_CONFIG_ALLOW_CROSS: '1'
    # no OIDC, production environment, cloud credentials or shared candidate build cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: x86_64-unknown-linux-musl
          cache: false
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: just
      - name: Build one immutable A/A artifact before admission
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils musl-tools pkg-config
          sudo ln -sf /usr/bin/musl-gcc /usr/bin/x86_64-unknown-linux-musl-gcc
          just build-release
          mkdir -p "$RUNNER_TEMP/binaries"
          for name in rcp rcpd filegen; do
            install -m 0755 "target/x86_64-unknown-linux-musl/release/$name" "$RUNNER_TEMP/binaries/$name"
            strip --strip-debug "$RUNNER_TEMP/binaries/$name"
            size=$(stat -c %s "$RUNNER_TEMP/binaries/$name")
            test "$size" -gt 0 && test "$size" -le 134217728
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-aa-binaries
          path: ${{ runner.temp }}/binaries/
          retention-days: 1
          if-no-files-found: error

  submit:
    if: github.event_name == 'schedule' || inputs.mode == 'benchmark'
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    # convenience only: central transactions, immutable run keys and independent expiry enforce safety
    concurrency:
      group: aws-production-submit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: production-aa-binaries
          path: ${{ runner.temp }}/candidate-data
      - name: Install the pinned submission SDK
        run: python3 -m pip install --require-hashes -r infra/aws_benchmark/requirements.txt
      - name: Reserve, upload data and submit the existing run
        env:
          REVISION: ${{ needs.validate.outputs.revision }}
          REGION: ${{ vars.RCP_AWS_PRODUCTION_REGION }}
          ROLE: ${{ vars.RCP_AWS_PRODUCTION_SUBMIT_ROLE }}
          FUNCTION: ${{ vars.RCP_AWS_PRODUCTION_ADMISSION_FUNCTION }}
          BUCKET: ${{ vars.RCP_AWS_PRODUCTION_BUCKET }}
          AUDIENCE: ${{ vars.RCP_AWS_PRODUCTION_AUDIENCE }}
        run: |
          python3 -m infra.aws_benchmark.production_client \
            --binaries "$RUNNER_TEMP/candidate-data" --revision "$REVISION" \
            --receipt "$RUNNER_TEMP/production-admission.json" \
            --region "$REGION" --role "$ROLE" --function "$FUNCTION" \
            --bucket "$BUCKET" --audience "$AUDIENCE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: production-admission-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-admission.json
          retention-days: 90
          if-no-files-found: warn

  identity-test:
    if: inputs.mode == 'identity-test' && github.repository == 'wykurz/rcp' && github.repository_id == '655073755' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor_id == '483465' && github.run_attempt == 1 && (vars.RCP_AWS_PRODUCTION_ENABLED == '' || vars.RCP_AWS_PRODUCTION_ENABLED == 'false')
    runs-on: ubuntu-24.04
    cache-mode: none
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    # no environment: the existing trust tests the main-ref subject, not an environment subject
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned identity verification dependencies before requesting tokens
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r infra/aws_benchmark/production-requirements.txt
      - name: Observe only signed identity and a deny-all STS session
        env:
          RCP_ACCEPTANCE_MODE: ${{ inputs.mode }}
          RCP_PRODUCTION_ENABLED: ${{ vars.RCP_AWS_PRODUCTION_ENABLED }}
          RCP_REQUESTED_REVISION: ${{ inputs.revision }}
          RCP_IDENTITY_APPROVAL: ${{ inputs.identity_approval }}
        run: |
          python3 -B -m infra.aws_benchmark.acceptance_oidc_workflow > "$RUNNER_TEMP/oidc-observation.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: production-oidc-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oidc-observation.json
          retention-days: 30
          if-no-files-found: warn
