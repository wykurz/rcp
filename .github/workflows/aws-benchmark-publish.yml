name: Publish retired AWS benchmark history

# keyless read-only reporting; this never starts a benchmark
on:
  push:
    branches: [main]
  schedule:
    # reporting cadence only; the separate gate defaults closed
    - cron: '43 9 * * *'
    # after Monday/Friday's maximum normal capacity/runtime/drain window and collection margin
    - cron: '43 3 * * 2,6'
  workflow_dispatch:
    inputs:
      mode:
        description: Render retained AWS reports or run separately approved reader acceptance
        type: choice
        options:
          - publish
          - reader-test
        default: publish
        required: true
      reader_approval:
        description: Nonsecret finite reader-test approval JSON; see ACCEPTANCE.md
        type: string
        required: false

permissions:
  contents: read

env:
  PUBLISH_SCHEDULE_ENABLED: ${{ vars.RCP_AWS_PRODUCTION_PUBLISH_SCHEDULE_ENABLED }}
  PUBLICATION_ENABLED: ${{ vars.RCP_AWS_PRODUCTION_PUBLISH_ENABLED }}

jobs:
  download:
    if: github.repository == 'wykurz/rcp' && github.repository_id == '655073755' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'publish') || github.event_name == 'push' || (github.event_name == 'schedule' && vars.RCP_AWS_PRODUCTION_PUBLISH_SCHEDULE_ENABLED == 'true')) && github.actor_id == '483465' && github.run_attempt == '1' && vars.RCP_AWS_PRODUCTION_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    cache-mode: none
    timeout-minutes: 15
    # no environment: preserve the existing main-ref AWS trust subject
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_id: ${{ steps.public.outputs.artifact-id }}
      inventory_sha256: ${{ steps.download.outputs.inventory_sha256 }}
      reader_revision: ${{ steps.download.outputs.reader_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the exact owner and main reporting workflow
        run: python3 -B -m infra.aws_benchmark.production_reports identity
      - name: Install the pinned read-only SDK before requesting a token
        run: |
          python3 -m venv "$RUNNER_TEMP/publication-sdk"
          "$RUNNER_TEMP/publication-sdk/bin/pip" install --only-binary=:all: --require-hashes -r infra/aws_benchmark/requirements.txt
      - name: Read the frozen retired public reports
        id: download
        env:
          REGION: ${{ vars.RCP_AWS_PRODUCTION_REGION }}
          ROLE: ${{ vars.RCP_AWS_PRODUCTION_PUBLISH_ROLE }}
          BUCKET: ${{ vars.RCP_AWS_PRODUCTION_BUCKET }}
          TABLE: ${{ vars.RCP_AWS_PRODUCTION_TABLE }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          "$RUNNER_TEMP/publication-sdk/bin/python" -B -m infra.aws_benchmark.production_reports download \
            --region "$REGION" --role "$ROLE" --bucket "$BUCKET" --table "$TABLE" \
            --output "$RUNNER_TEMP/public-records" --reader-revision "$GITHUB_SHA" --require-complete
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: public
        with:
          name: aws-public-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-records/
          retention-days: 1
          if-no-files-found: error

  pages:
    needs: download
    if: github.repository == 'wykurz/rcp' && github.repository_id == '655073755' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'publish') || github.event_name == 'push' || (github.event_name == 'schedule' && vars.RCP_AWS_PRODUCTION_PUBLISH_SCHEDULE_ENABLED == 'true')) && github.actor_id == '483465' && github.run_attempt == '1' && vars.RCP_AWS_PRODUCTION_PUBLISH_ENABLED == 'true' && vars.RCP_BENCHMARK_PAGES == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/benchmark-pages.yml
    with:
      aws_records_artifact: ${{ needs.download.outputs.artifact_id }}
      aws_inventory_sha256: ${{ needs.download.outputs.inventory_sha256 }}
      aws_reader_revision: ${{ needs.download.outputs.reader_revision }}

  reader-test:
    if: inputs.mode == 'reader-test' && github.repository == 'wykurz/rcp' && github.repository_id == '655073755' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor_id == '483465' && github.run_attempt == '1' && (vars.RCP_AWS_PRODUCTION_ENABLED == '' || vars.RCP_AWS_PRODUCTION_ENABLED == 'false') && (vars.RCP_AWS_PRODUCTION_PUBLISH_ENABLED == '' || vars.RCP_AWS_PRODUCTION_PUBLISH_ENABLED == 'false') && (vars.RCP_AWS_HISTORY_TRUST_READY == '' || vars.RCP_AWS_HISTORY_TRUST_READY == 'false')
    runs-on: ubuntu-24.04
    cache-mode: none
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    # no environment: the existing main-ref AWS subject must remain unchanged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned dependencies before requesting a token
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes -r infra/aws_benchmark/production-requirements.txt
      - name: Observe only the exact publication identity and bounded read controls
        env:
          RCP_PUBLICATION_MODE: ${{ inputs.mode }}
          RCP_PUBLICATION_APPROVAL: ${{ inputs.reader_approval }}
          RCP_PRODUCTION_ENABLED: ${{ vars.RCP_AWS_PRODUCTION_ENABLED }}
          RCP_PUBLISH_ENABLED: ${{ vars.RCP_AWS_PRODUCTION_PUBLISH_ENABLED }}
          RCP_TRUST_READY: ${{ vars.RCP_AWS_HISTORY_TRUST_READY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python3 -B -m infra.aws_benchmark.acceptance_publication_workflow > "$RUNNER_TEMP/publication-reader-observation.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: publication-reader-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-reader-observation.json
          retention-days: 30
          if-no-files-found: warn
