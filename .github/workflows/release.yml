name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v0.23.0)'
        required: true
      skip_validation:
        description: 'Skip validation step (for re-runs after release)'
        type: boolean
        default: false
      dry_run:
        description: 'Build only, do not create or upload to release'
        type: boolean
        default: false

# Least-privilege default for every job; jobs that need more (release asset
# uploads) opt up with their own permissions: block.
permissions:
  contents: read

# selected release source must neither consume nor poison shared Actions caches
cache-mode: none

jobs:
  resolve-release:
    uses: ./.github/workflows/resolve-release-tag.yml
    with:
      release_tag: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}

  validate:
    needs: resolve-release
    if: ${{ needs.resolve-release.result == 'success' && (github.event_name != 'workflow_dispatch' || !inputs.skip_validation) }}
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.resolve-release.outputs.commit }}

  create-release:
    runs-on: ubuntu-latest
    needs: [resolve-release, validate]
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
    if: ${{ !cancelled() && needs.resolve-release.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
          persist-credentials: false

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${RELEASE_TAG#v}"
          # compare the heading literally so prerelease and build metadata need no regex escaping
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "## [" ver "]") == 1) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)
          # fail if no release notes found (missing or mistyped version in CHANGELOG)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::No release notes found for version ${VERSION} in CHANGELOG.md"
            echo "Ensure CHANGELOG.md has a '## [${VERSION}]' section with content."
            exit 1
          fi
          # write to file for multi-line support
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$NOTES" > "$NOTES_FILE"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          # a hyphen in build metadata does not make the version a prerelease
          if [[ "${VERSION%%+*}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Draft Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.resolve-release.outputs.tag }}
          draft: true
          prerelease: ${{ steps.changelog.outputs.prerelease }}
          generate_release_notes: false
          body_path: ${{ steps.changelog.outputs.notes_file }}

  build-deb-amd64:
    runs-on: ubuntu-latest
    needs: [resolve-release, validate, create-release]
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
    if: ${{ !cancelled() && needs.resolve-release.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.package.outputs.artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
          persist-credentials: false

      - name: Restore release tag for build metadata
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$RELEASE_COMMIT"
          # restore only the verified tag locally; keep the source pinned without another fetch
          git tag -- "$RELEASE_TAG" "$RELEASE_COMMIT"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: x86_64-unknown-linux-musl

      - name: Install musl toolchain deps
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config
          sudo ln -sf /usr/bin/musl-gcc /usr/bin/x86_64-unknown-linux-musl-gcc

      - name: Install cargo-deb
        run: ./scripts/cargo-install-host.sh cargo-deb --version 3.7.0 --locked

      - name: Build Debian packages
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          RUSTFLAGS: "--cfg tokio_unstable -C target-feature=+crt-static"
        run: |
          CARGO_BUILD_TARGET=x86_64-unknown-linux-musl ./scripts/cargo-host.sh deb -p rcp-tools-rcp
          CARGO_BUILD_TARGET=x86_64-unknown-linux-musl ./scripts/cargo-host.sh deb -p rcp-tools-rlink
          CARGO_BUILD_TARGET=x86_64-unknown-linux-musl ./scripts/cargo-host.sh deb -p rcp-tools-rrm
          CARGO_BUILD_TARGET=x86_64-unknown-linux-musl ./scripts/cargo-host.sh deb -p rcp-tools-rcmp
          CARGO_BUILD_TARGET=x86_64-unknown-linux-musl ./scripts/cargo-host.sh deb -p rcp-tools-filegen
          # cargo-deb keeps package archives in target/debian even with an explicit build target.
          zip rcp-deb-amd64-${RELEASE_TAG}.zip target/debian/*.deb
          ls -la rcp-deb-amd64-${RELEASE_TAG}.zip

      - name: Retain package bundle
        id: package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-deb-amd64-${{ needs.resolve-release.outputs.commit }}-${{ github.run_attempt }}
          path: ./rcp-deb-amd64-${{ env.RELEASE_TAG }}.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0


  build-rpm-amd64:
    runs-on: ubuntu-latest
    needs: [resolve-release, validate, create-release]
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
    if: ${{ !cancelled() && needs.resolve-release.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.package.outputs.artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
          persist-credentials: false

      - name: Restore release tag for build metadata
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$RELEASE_COMMIT"
          # restore only the verified tag locally; keep the source pinned without another fetch
          git tag -- "$RELEASE_TAG" "$RELEASE_COMMIT"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: x86_64-unknown-linux-musl

      - name: Install musl toolchain deps
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config
          sudo ln -sf /usr/bin/musl-gcc /usr/bin/x86_64-unknown-linux-musl-gcc

      - name: Install cargo-generate-rpm
        run: ./scripts/cargo-install-host.sh cargo-generate-rpm --version 0.21.0 --locked

      - name: Build RPM packages
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          RUSTFLAGS: "--cfg tokio_unstable -C target-feature=+crt-static"
        run: |
          RPM_VERSION=$(python3 scripts/release-rpm-version.py "$RELEASE_TAG")
          CARGO_BUILD_TARGET=x86_64-unknown-linux-musl ./scripts/cargo-host.sh build --release
          CARGO_BUILD_TARGET=x86_64-unknown-linux-musl ./scripts/cargo-host.sh generate-rpm --target=x86_64-unknown-linux-musl -p rcp -s "version = \"$RPM_VERSION\""
          CARGO_BUILD_TARGET=x86_64-unknown-linux-musl ./scripts/cargo-host.sh generate-rpm --target=x86_64-unknown-linux-musl -p rlink -s "version = \"$RPM_VERSION\""
          CARGO_BUILD_TARGET=x86_64-unknown-linux-musl ./scripts/cargo-host.sh generate-rpm --target=x86_64-unknown-linux-musl -p rrm -s "version = \"$RPM_VERSION\""
          CARGO_BUILD_TARGET=x86_64-unknown-linux-musl ./scripts/cargo-host.sh generate-rpm --target=x86_64-unknown-linux-musl -p rcmp -s "version = \"$RPM_VERSION\""
          CARGO_BUILD_TARGET=x86_64-unknown-linux-musl ./scripts/cargo-host.sh generate-rpm --target=x86_64-unknown-linux-musl -p filegen -s "version = \"$RPM_VERSION\""
          zip rcp-rpm-amd64-${RELEASE_TAG}.zip target/x86_64-unknown-linux-musl/generate-rpm/*.rpm
          ls -la rcp-rpm-amd64-${RELEASE_TAG}.zip

      - name: Retain package bundle
        id: package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-rpm-amd64-${{ needs.resolve-release.outputs.commit }}-${{ github.run_attempt }}
          path: ./rcp-rpm-amd64-${{ env.RELEASE_TAG }}.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0


  build-deb-arm64:
    runs-on: ubuntu-latest
    needs: [resolve-release, validate, create-release]
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
    if: ${{ !cancelled() && needs.resolve-release.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.package.outputs.artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
          persist-credentials: false

      - name: Restore release tag for build metadata
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$RELEASE_COMMIT"
          # restore only the verified tag locally; keep the source pinned without another fetch
          git tag -- "$RELEASE_TAG" "$RELEASE_COMMIT"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Add ARM64 target
        run: rustup target add aarch64-unknown-linux-musl

      - name: Install cross
        run: ./scripts/cargo-install-host.sh cross --locked --version 0.2.5

      - name: Install cargo-deb
        run: ./scripts/cargo-install-host.sh cargo-deb --version 3.7.0 --locked

      - name: Build with cross
        env:
          RUSTFLAGS: "--cfg tokio_unstable -C target-feature=+crt-static"
        run: cross build --release --target=aarch64-unknown-linux-musl

      - name: Build Debian packages
        run: |
          CARGO_BUILD_TARGET=aarch64-unknown-linux-musl ./scripts/cargo-host.sh deb --no-build -p rcp-tools-rcp
          CARGO_BUILD_TARGET=aarch64-unknown-linux-musl ./scripts/cargo-host.sh deb --no-build -p rcp-tools-rlink
          CARGO_BUILD_TARGET=aarch64-unknown-linux-musl ./scripts/cargo-host.sh deb --no-build -p rcp-tools-rrm
          CARGO_BUILD_TARGET=aarch64-unknown-linux-musl ./scripts/cargo-host.sh deb --no-build -p rcp-tools-rcmp
          CARGO_BUILD_TARGET=aarch64-unknown-linux-musl ./scripts/cargo-host.sh deb --no-build -p rcp-tools-filegen
          # cargo-deb keeps package archives in target/debian even with an explicit build target.
          zip rcp-deb-arm64-${RELEASE_TAG}.zip target/debian/*.deb
          ls -la rcp-deb-arm64-${RELEASE_TAG}.zip

      - name: Retain package bundle
        id: package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-deb-arm64-${{ needs.resolve-release.outputs.commit }}-${{ github.run_attempt }}
          path: ./rcp-deb-arm64-${{ env.RELEASE_TAG }}.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0


  build-rpm-arm64:
    runs-on: ubuntu-latest
    needs: [resolve-release, validate, create-release]
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
    if: ${{ !cancelled() && needs.resolve-release.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.package.outputs.artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
          persist-credentials: false

      - name: Restore release tag for build metadata
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$RELEASE_COMMIT"
          # restore only the verified tag locally; keep the source pinned without another fetch
          git tag -- "$RELEASE_TAG" "$RELEASE_COMMIT"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Add ARM64 target
        run: rustup target add aarch64-unknown-linux-musl

      - name: Install cross
        run: ./scripts/cargo-install-host.sh cross --locked --version 0.2.5

      - name: Install cargo-generate-rpm
        run: ./scripts/cargo-install-host.sh cargo-generate-rpm --version 0.21.0 --locked

      - name: Build with cross
        env:
          RUSTFLAGS: "--cfg tokio_unstable -C target-feature=+crt-static"
        run: cross build --release --target=aarch64-unknown-linux-musl

      - name: Build RPM packages
        run: |
          RPM_VERSION=$(python3 scripts/release-rpm-version.py "$RELEASE_TAG")
          CARGO_BUILD_TARGET=aarch64-unknown-linux-musl ./scripts/cargo-host.sh generate-rpm --target=aarch64-unknown-linux-musl -p rcp -s "version = \"$RPM_VERSION\""
          CARGO_BUILD_TARGET=aarch64-unknown-linux-musl ./scripts/cargo-host.sh generate-rpm --target=aarch64-unknown-linux-musl -p rlink -s "version = \"$RPM_VERSION\""
          CARGO_BUILD_TARGET=aarch64-unknown-linux-musl ./scripts/cargo-host.sh generate-rpm --target=aarch64-unknown-linux-musl -p rrm -s "version = \"$RPM_VERSION\""
          CARGO_BUILD_TARGET=aarch64-unknown-linux-musl ./scripts/cargo-host.sh generate-rpm --target=aarch64-unknown-linux-musl -p rcmp -s "version = \"$RPM_VERSION\""
          CARGO_BUILD_TARGET=aarch64-unknown-linux-musl ./scripts/cargo-host.sh generate-rpm --target=aarch64-unknown-linux-musl -p filegen -s "version = \"$RPM_VERSION\""
          zip rcp-rpm-arm64-${RELEASE_TAG}.zip target/aarch64-unknown-linux-musl/generate-rpm/*.rpm
          ls -la rcp-rpm-arm64-${RELEASE_TAG}.zip

      - name: Retain package bundle
        id: package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-rpm-arm64-${{ needs.resolve-release.outputs.commit }}-${{ github.run_attempt }}
          path: ./rcp-rpm-arm64-${{ env.RELEASE_TAG }}.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0


  upload-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [resolve-release, create-release, build-deb-amd64, build-rpm-amd64, build-deb-arm64, build-rpm-arm64]
    if: ${{ !cancelled() && needs.resolve-release.result == 'success' && needs.create-release.result == 'success' && needs.build-deb-amd64.result == 'success' && needs.build-rpm-amd64.result == 'success' && needs.build-deb-arm64.result == 'success' && needs.build-rpm-arm64.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout the trusted workflow controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false

      - name: Stage the bounded package artifact set
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.commit }}
          DEB_AMD64_ID: ${{ needs.build-deb-amd64.outputs.artifact-id }}
          RPM_AMD64_ID: ${{ needs.build-rpm-amd64.outputs.artifact-id }}
          DEB_ARM64_ID: ${{ needs.build-deb-arm64.outputs.artifact-id }}
          RPM_ARM64_ID: ${{ needs.build-rpm-arm64.outputs.artifact-id }}
        run: python3 -I "$GITHUB_WORKSPACE/controller/scripts/stage-release-assets.py"

      - name: Upload validated bundles without executing their contents
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.resolve-release.outputs.tag }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.assets.outputs.directory }}/rcp-deb-amd64-${{ needs.resolve-release.outputs.tag }}.zip
            ${{ steps.assets.outputs.directory }}/rcp-rpm-amd64-${{ needs.resolve-release.outputs.tag }}.zip
            ${{ steps.assets.outputs.directory }}/rcp-deb-arm64-${{ needs.resolve-release.outputs.tag }}.zip
            ${{ steps.assets.outputs.directory }}/rcp-rpm-arm64-${{ needs.resolve-release.outputs.tag }}.zip

  publish-crates:
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://github.com/wykurz/rcp/commit/${{ needs.resolve-release.outputs.commit }}
    needs: [resolve-release, upload-release]
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
    if: ${{ !cancelled() && needs.resolve-release.result == 'success' && needs.upload-release.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
          persist-credentials: false

      - name: Require the environment publishing credential
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_PUBLISH_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo '::error::Configure and approve the crates-io environment before publishing.' >&2
            exit 1
          fi

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Install cargo-workspaces
        run: ./scripts/cargo-install-host.sh cargo-workspaces --version 0.4.2 --locked

      - name: Verify version matches release tag
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Tag version: $TAG_VERSION"
          echo "Cargo version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

      - name: Publish to crates.io
        id: publish
        # cargo-workspaces can swallow a per-crate publish failure and still exit 0, and
        # may exit non-zero on already-published crates during a re-run. Don't gate the
        # job on its exit code — the "Verify crates.io publication" step below is the
        # source of truth.
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_PUBLISH_TOKEN }}
        run: |
          # --no-verify skips the verification build step which would fail because
          # .cargo/config.toml sets musl as the default target and the musl linker
          # isn't available in this environment. The validate job already verified
          # the build, so this is safe.
          ./scripts/cargo-host.sh workspaces publish \
            --publish-as-is \
            --yes \
            --no-verify

      - name: Verify crates.io publication
        run: |
          echo "## crates.io Publication Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          # errexit off so we can capture the script's status, append the closing code fence,
          # and exit with the real result. 2>&1 folds the script's stderr (e.g. its final
          # "ERROR: ... missing" line) into the summary; PIPESTATUS[0] = script, not tee.
          set +e
          scripts/check-crates-published.sh "${RELEASE_TAG#v}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  publish-release:
    runs-on: ubuntu-latest
    needs: [resolve-release, publish-crates]
    if: ${{ !cancelled() && needs.resolve-release.result == 'success' && needs.publish-crates.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    permissions:
      contents: write
    steps:
      - name: Publish Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.resolve-release.outputs.tag }}
          draft: false
