name: AWS benchmark (operator window required)

on:
  workflow_dispatch:
    inputs:
      execution:
        description: Direct EC2 submission requires separately deployed guards and an operator-armed lease
        required: true
        type: choice
        default: operator-window
        options: [operator-window, durable-submit]
      baseline:
        description: Full 40-character lowercase baseline commit SHA
        required: true
        type: string
      candidate:
        description: Full 40-character lowercase candidate commit SHA
        required: true
        type: string
      suite:
        description: Start with identical revisions and aa-smoke
        required: true
        type: choice
        default: aa-smoke
        options: [aa-smoke, tiny, medium, large, deep, bulk-1g-metadata]

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && vars.RCP_AWS_BENCHMARK_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      max-binary: ${{ steps.protocol.outputs.max-binary }}
      build-roles: ${{ steps.protocol.outputs.build-roles }}
    steps:
      - name: Require exact trusted ref before checking out repository code
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REPOSITORY" = 'wykurz/rcp'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate pinned revisions and suite
        id: protocol
        env:
          BASELINE: ${{ inputs.baseline }}
          CANDIDATE: ${{ inputs.candidate }}
          SUITE: ${{ inputs.suite }}
          EXECUTION: ${{ inputs.execution }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from infra.aws_benchmark.common import MAX_BINARY, require
          from infra.aws_benchmark.identity import environment
          binding = environment()
          if os.environ.get('EXECUTION') == 'durable-submit':
              require(binding['suite'] == 'bulk-1g-metadata' and binding['baseline'] == binding['candidate'],
                      'Durable qualification requires identical revisions and bulk-1g-metadata')
          print('RCP_AWS_RUN_IDENTITY=' + json.dumps(binding, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'max-binary={MAX_BINARY}', file=output)
              roles = ['baseline'] if binding['baseline'] == binding['candidate'] else ['baseline', 'candidate']
              print('build-roles=' + json.dumps(roles), file=output)
          PY

  build:
    needs: validate
    runs-on: ubuntu-24.04
    cache-mode: none
    timeout-minutes: 45
    env:
      RUSTFLAGS: --cfg tokio_unstable
      PKG_CONFIG_ALLOW_CROSS: '1'
      MAX_BINARY: ${{ needs.validate.outputs.max-binary }}
    # no OIDC, environment secrets, AWS credentials, shared caches, or self-hosted runner
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        role: ${{ fromJSON(needs.validate.outputs.build-roles) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.role == 'baseline' && inputs.baseline || inputs.candidate }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: x86_64-unknown-linux-musl
          cache: false
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: just
      - name: Build before opening the expensive worker
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils musl-tools pkg-config
          sudo ln -sf /usr/bin/musl-gcc /usr/bin/x86_64-unknown-linux-musl-gcc
          just build-release
          mkdir -p "$RUNNER_TEMP/binaries"
          for name in rcp rcpd filegen; do
            install -m 0755 "target/x86_64-unknown-linux-musl/release/$name" "$RUNNER_TEMP/binaries/$name"
            strip --strip-debug "$RUNNER_TEMP/binaries/$name"
            size=$(stat -c %s "$RUNNER_TEMP/binaries/$name")
            if [ "$size" -le 0 ] || [ "$size" -gt "$MAX_BINARY" ]; then
              echo "::error::$name is $size bytes; required range is 1..$MAX_BINARY"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-${{ matrix.role }}
          path: ${{ runner.temp }}/binaries/
          retention-days: 1
          if-no-files-found: error

  benchmark:
    needs: build
    if: inputs.execution != 'durable-submit'
    # only this job uses the mailbox; report-only retries must not queue or displace paid jobs
    concurrency:
      group: aws-benchmark-single-mailbox
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # includes the maximum opening lead/window, teardown, and bounded final upload
    timeout-minutes: 90
    # required reviewer arms the window only after the binary build has completed
    environment: aws-benchmark
    outputs:
      run-identity: ${{ steps.identity.outputs.run-identity }}
      result-artifact-id: ${{ steps.raw-results.outputs.artifact-id }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind the producer attempt before reading candidate artifacts
        id: identity
        env:
          BASELINE: ${{ inputs.baseline }}
          CANDIDATE: ${{ inputs.candidate }}
          SUITE: ${{ inputs.suite }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from infra.aws_benchmark.identity import environment
          binding = json.dumps(environment(), sort_keys=True, separators=(',', ':'))
          print('RCP_AWS_PRODUCER_IDENTITY=' + binding)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print('Benchmark producer identity\n\n```json\n' + binding + '\n```\n', file=summary)
          (Path(os.environ['RUNNER_TEMP']) / 'aws-identity.json').write_text(binding, encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('run-identity=' + binding, file=output)
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aws-baseline
          path: ${{ runner.temp }}/binaries/baseline
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.baseline == inputs.candidate && 'aws-baseline' || 'aws-candidate' }}
          path: ${{ runner.temp }}/binaries/candidate
      - name: Install AWS SDK for trusted controller
        run: |
          python3 -m venv "$RUNNER_TEMP/aws-sdk"
          "$RUNNER_TEMP/aws-sdk/bin/pip" install --require-hashes -r infra/aws_benchmark/requirements.txt
      - name: Run within the operator window and verify teardown
        env:
          AWS_REGION: ${{ vars.RCP_AWS_REGION }}
          ASG: ${{ vars.RCP_AWS_ASG }}
          BUCKET: ${{ vars.RCP_AWS_BUCKET }}
          ROLE: ${{ vars.RCP_AWS_ROLE_ARN }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          "$RUNNER_TEMP/aws-sdk/bin/python" -m infra.aws_benchmark.controller \
            --region "$AWS_REGION" --asg "$ASG" --bucket "$BUCKET" --role-arn "$ROLE" \
            --identity "$RUNNER_TEMP/aws-identity.json" \
            --binaries "$RUNNER_TEMP/binaries" --output "$RUNNER_TEMP/aws-results"
      - name: Preserve bounded results even when a comparison fails
        id: raw-results
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-benchmark-results
          path: ${{ runner.temp }}/aws-results/
          retention-days: 90
          if-no-files-found: warn

      - name: Identify the trusted raw artifact
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.raw-results.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.raw-results.outputs.artifact-digest }}
        run: |
          if [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            printf '\nTrusted raw artifact: [ID %s](https://github.com/wykurz/rcp/actions/runs/%s/artifacts/%s)\n\nSHA-256: `%s`\n' \
              "$ARTIFACT_ID" "$GITHUB_RUN_ID" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nNo trusted raw artifact was uploaded. Do not select an artifact by name.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  report:
    needs: [validate, benchmark]
    if: always() && needs.validate.result == 'success' && needs.benchmark.outputs.result-artifact-id != '' && needs.benchmark.outputs.run-identity != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # untrusted result parsing has no environment, OIDC, AWS credentials or history write access
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # bind the trusted producer; never fall back to a name or another run
          artifact-ids: ${{ needs.benchmark.outputs.result-artifact-id }}
          path: ${{ runner.temp }}/aws-raw
      - name: Validate bounded evidence and render diagnostic report
        env:
          PRODUCER_IDENTITY: ${{ needs.benchmark.outputs.run-identity }}
          PRODUCER_CONCLUSION: ${{ needs.benchmark.result }}
        run: |
          printf '%s\n' "$PRODUCER_IDENTITY" > "$RUNNER_TEMP/aws-identity.json"
          python3 -m infra.aws_benchmark.results "$RUNNER_TEMP/aws-raw" \
            --identity "$RUNNER_TEMP/aws-identity.json" \
            --output "$RUNNER_TEMP/aws-report" --conclusion "$PRODUCER_CONCLUSION"
      - name: Add readable result summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/aws-report/summary.md" ]; then
            cat "$RUNNER_TEMP/aws-report/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve raw evidence and derived report
        id: report-results
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-benchmark-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aws-report/
          retention-days: 90
          if-no-files-found: warn
      - name: Identify the trusted report artifact
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.report-results.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.report-results.outputs.artifact-digest }}
        run: |
          if [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            printf '\nTrusted report artifact: [ID %s](https://github.com/wykurz/rcp/actions/runs/%s/artifacts/%s)\n\nSHA-256: `%s`\n' \
              "$ARTIFACT_ID" "$GITHUB_RUN_ID" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nNo trusted report artifact was uploaded. Do not select an artifact by name.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  durable-submit:
    needs: build
    if: inputs.execution == 'durable-submit' && vars.RCP_AWS_DURABLE_ENABLED == 'true'
    # a short submission never waits for capacity or claims benchmark completion
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: aws-benchmark-durable
    concurrency:
      group: aws-benchmark-single-mailbox
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require literal trusted producer before checking out controller code
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REPOSITORY" = 'wykurz/rcp'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind durable producer identity
        env:
          BASELINE: ${{ inputs.baseline }}
          CANDIDATE: ${{ inputs.candidate }}
          SUITE: ${{ inputs.suite }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from infra.aws_benchmark.identity import environment
          from infra.aws_benchmark.common import require
          binding = environment()
          require(binding['suite'] == 'bulk-1g-metadata' and binding['baseline'] == binding['candidate'],
                  'Durable qualification requires identical revisions and bulk-1g-metadata')
          (Path(os.environ['RUNNER_TEMP']) / 'aws-identity.json').write_text(json.dumps(binding))
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aws-baseline
          path: ${{ runner.temp }}/binaries/baseline
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.baseline == inputs.candidate && 'aws-baseline' || 'aws-candidate' }}
          path: ${{ runner.temp }}/binaries/candidate
      - name: Install SDK for trusted submission
        run: |
          python3 -m venv "$RUNNER_TEMP/aws-sdk"
          "$RUNNER_TEMP/aws-sdk/bin/pip" install --require-hashes -r infra/aws_benchmark/requirements.txt
      - name: Submit once within the immutable operator request
        env:
          AWS_REGION: ${{ vars.RCP_AWS_REGION }}
          BUCKET: ${{ vars.RCP_AWS_BUCKET }}
          ROLE: ${{ vars.RCP_AWS_DURABLE_ROLE_ARN }}
          STATE_MACHINE: ${{ vars.RCP_AWS_DURABLE_STATE_MACHINE_ARN }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          "$RUNNER_TEMP/aws-sdk/bin/python" -m infra.aws_benchmark.durable_client submit \
            --region "$AWS_REGION" --bucket "$BUCKET" --state-machine "$STATE_MACHINE" --role-arn "$ROLE" \
            --identity "$RUNNER_TEMP/aws-identity.json" --binaries "$RUNNER_TEMP/binaries" \
            --output "$RUNNER_TEMP/durable-submission"
          printf '\nDirect EC2 request submitted. Benchmark outcome and cleanup remain pending; use the separate collection workflow.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: aws-durable-submission-${{ github.run_attempt }}
          path: ${{ runner.temp }}/durable-submission/
          retention-days: 30
          if-no-files-found: warn
