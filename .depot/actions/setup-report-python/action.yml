name: Set up report Python
description: Install pinned reporting dependencies and optional offline AWS test dependencies

# shared by GitHub and Depot; Depot remaps local .github action paths to .depot

inputs:
  aws-benchmark-tests:
    description: Install the pinned SDK and cryptography closure for offline AWS safety tests
    required: false
    default: 'false'

runs:
  using: composite
  steps:
  - name: Install report dependencies
    shell: bash
    run: |
      sudo apt-get update
      sudo apt-get install -y --no-install-recommends python3-venv
      python3 -m venv --system-site-packages "$RUNNER_TEMP/report-site-venv"
      # reinstall even matching system packages so the wheel hashes are always checked
      "$RUNNER_TEMP/report-site-venv/bin/python" -m pip install --ignore-installed --require-hashes -r scripts/report-site-requirements.txt
      echo "$RUNNER_TEMP/report-site-venv/bin" >> "$GITHUB_PATH"
  - name: Install offline AWS test dependencies
    if: inputs.aws-benchmark-tests == 'true'
    shell: bash
    run: |
      "$RUNNER_TEMP/report-site-venv/bin/python" -m pip install --ignore-installed --require-hashes -r infra/aws_benchmark/production-requirements.txt
