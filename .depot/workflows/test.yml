name: RCP focused tests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  PKG_CONFIG_ALLOW_CROSS: "1"
  RUSTC_WRAPPER: sccache
  RUSTFLAGS: --cfg tokio_unstable

jobs:
  test:
    name: Focused tests (x86 debug)
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.depot/actions/rcp-rust-setup
      with:
        install-nextest: "true"
        install-test-deps: "true"
        localhost-ssh: "true"
    - name: Cache Rust build outputs
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        cache-on-failure: "true"
    - name: Run selected debug tests
      run: |
        python3 - <<'PY'
        import base64
        import json
        import os

        arguments = json.loads(base64.b64decode(os.environ.get("RCP_DEPOT_TEST_ARGS_B64", "W10=")))
        os.execvp("just", ["just", "test", *arguments])
        PY
