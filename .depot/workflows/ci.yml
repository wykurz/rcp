name: RCP CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  PKG_CONFIG_ALLOW_CROSS: "1"
  RUSTC_WRAPPER: sccache
  RUSTFLAGS: --cfg tokio_unstable

jobs:
  lint:
    name: Lint
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
    - uses: ./.depot/actions/rcp-rust-setup
      with:
        install-dprint: "true"
        install-openssh: "true"
    - name: Cache Rust build outputs
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        cache-on-failure: "true"
    - uses: ./.depot/actions/setup-report-python
      with:
        aws-benchmark-tests: "true"
    - uses: ./.depot/actions/setup-actionlint
    - name: Identify Nix nextest output
      id: nextest
      run: |
        nextest_path=$(nix eval --raw --no-update-lock-file .#devShells.x86_64-linux.default.cargoNextest.outPath)
        echo "path=$nextest_path" >> "$GITHUB_OUTPUT"
        echo "key=depot-nix-nextest-v1-${nextest_path##*/}" >> "$GITHUB_OUTPUT"
        echo "NIX_NEXTEST_CACHE=$RUNNER_TEMP/nix-nextest" >> "$GITHUB_ENV"
    - name: Cache Nix nextest closure
      id: nextest-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      with:
        path: ${{ env.NIX_NEXTEST_CACHE }}
        key: ${{ steps.nextest.outputs.key }}
    - name: Import cached Nix nextest
      if: steps.nextest-cache.outputs.cache-hit == 'true'
      env:
        NEXTEST_PATH: ${{ steps.nextest.outputs.path }}
      run: |
        # Unsigned output trusts this manual workflow's shared Depot cache writers.
        if ! nix copy --no-check-sigs --from "file://$NIX_NEXTEST_CACHE" "$NEXTEST_PATH"; then
          echo "::warning::Nix nextest cache could not be imported; building normally"
        fi
    - name: Run lints
      run: just lint
    - name: Verify Nix build targets
      run: just nix-targets
    - name: Export Nix nextest closure
      if: steps.nextest-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      env:
        NEXTEST_PATH: ${{ steps.nextest.outputs.path }}
      run: nix copy --to "file://$NIX_NEXTEST_CACHE" "$NEXTEST_PATH"

  doc:
    name: Documentation
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.depot/actions/rcp-rust-setup
    - name: Cache Rust build outputs
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        cache-on-failure: "true"
    - name: Build documentation
      run: just doc

  test:
    name: Tests (debug, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
        - depot-ubuntu-24.04-8
        - depot-ubuntu-24.04-arm-8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Nix for native Arm package ABI smoke
      if: runner.arch == 'ARM64'
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
    - name: Verify native Arm Nix package ABI smoke
      if: runner.arch == 'ARM64'
      run: nix build --no-update-lock-file .#checks.aarch64-linux.package-abi-smoke
    - uses: ./.depot/actions/rcp-rust-setup
      with:
        install-nextest: "true"
        install-test-deps: "true"
        localhost-ssh: "true"
    - name: Cache Rust build outputs
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        cache-on-failure: "true"
    - name: Build debug test binaries
      run: just test --no-run
    - name: Run nextest (debug)
      run: just test

  doctest:
    name: Doctests (debug)
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.depot/actions/rcp-rust-setup
    - name: Cache Rust build outputs
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        cache-on-failure: "true"
    - name: Run debug doctests
      run: just doctest

  test-release:
    name: Tests (release, shard ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.depot/actions/rcp-rust-setup
      with:
        install-nextest: "true"
        install-test-deps: "true"
        localhost-ssh: "true"
    - name: Cache Rust build outputs
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        cache-on-failure: "true"
    - name: Build release test binaries
      run: just test-release --no-run
    - name: Run nextest (release)
      run: just test-release --partition count:${{ matrix.shard }}/2

  doctest-release:
    name: Doctests (release)
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.depot/actions/rcp-rust-setup
    - name: Cache Rust build outputs
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        cache-on-failure: "true"
    - name: Run release doctests
      run: just doctest-release

  docker-test:
    name: Docker tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
        - depot-ubuntu-24.04-8
        - depot-ubuntu-24.04-arm-8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.depot/actions/rcp-rust-setup
      with:
        install-nextest: "true"
    - name: Cache Rust build outputs
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        cache-on-failure: "true"
    - name: Build binaries and start Docker containers
      run: just docker-up
    - name: Run Docker integration tests
      run: just docker-test-only -E 'not test(~chaos)'
    - name: Show Docker logs on failure
      if: failure()
      run: just docker-logs-once
    - name: Stop Docker containers
      if: always()
      run: just docker-down

  docker-chaos-test:
    name: Docker chaos tests
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.depot/actions/rcp-rust-setup
      with:
        install-nextest: "true"
    - name: Cache Rust build outputs
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        cache-on-failure: "true"
    - name: Build binaries and start Docker containers
      run: just docker-up
    - name: Run Docker chaos tests
      run: just docker-chaos-test-only
    - name: Show Docker logs on failure
      if: failure()
      run: just docker-logs-once
    - name: Stop Docker containers
      if: always()
      run: just docker-down
